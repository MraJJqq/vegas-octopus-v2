<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#02040a">
<title>Vegas 章鱼 · AETHER 3D 数据宇宙</title>
<style>
:root{color-scheme:dark;--bg:#02040a;--text:#e8f5ff;--muted:#7898b9;--cyan:#31d9ff}
*{box-sizing:border-box}
html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#02040a;color:var(--text);font:13px/1.45 Inter,-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
body{position:fixed;inset:0;background:#02040a}
.app{position:relative;width:100%;height:100dvh;min-height:0;padding:0;background:#02040a;overflow:hidden}
.topbar{position:absolute;z-index:10;top:clamp(14px,2.2vh,28px);right:clamp(14px,2.2vw,32px);width:min(38vw,520px);min-width:280px;height:auto;display:block;pointer-events:none}
.event-top-card{width:100%;min-width:0;min-height:0;padding:0;display:flex;flex-direction:column;background:transparent!important;border:0!important;border-radius:0!important;box-shadow:none!important;pointer-events:auto}
.panel-head{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:0 0 7px}
.panel-title{display:flex;align-items:center;gap:7px;font-size:clamp(11px,.8vw,15px);font-weight:750;letter-spacing:.03em}
.panel-title .icon{display:inline-grid;place-items:center;width:clamp(20px,1.45vw,27px);height:clamp(20px,1.45vw,27px);border-radius:7px;background:rgba(35,200,255,.12);border:1px solid rgba(51,206,255,.3);color:var(--cyan)}
.v9-sync-status{font-size:clamp(8px,.6vw,10px);color:var(--muted);white-space:nowrap}
.v9-notification{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:clamp(8px,1vw,16px);flex:1;min-height:0;overflow:auto}
.v9-group{min-width:0;border-left:1px solid rgba(85,155,214,.18);padding-left:9px}
.v9-group-title{font-size:clamp(9px,.65vw,11px);font-weight:750;color:#a9d9ff;white-space:nowrap;margin-bottom:5px}
.v9-symbols{display:flex;flex-wrap:wrap;align-content:flex-start;gap:4px 7px;min-width:0}
.v9-symbol{font-size:clamp(8px,.62vw,10px);color:#8fe9ff;white-space:nowrap;text-shadow:0 0 8px rgba(49,217,255,.14)}
.v9-nochange{font-size:clamp(8px,.62vw,10px);color:#8ba4be;white-space:nowrap}
.main-grid{position:absolute;inset:0;min-width:0;min-height:0;display:grid;grid-template-columns:minmax(0,1fr);overflow:hidden;background:#02040a}
.center-stage{position:relative;isolation:isolate;min-width:0;min-height:0;width:100%;height:100%;overflow:hidden;border-radius:0;background:transparent}
#orb-core-canvas{position:absolute;inset:0;width:100%;height:100%;display:block;z-index:1;touch-action:pan-y;cursor:grab}
#orb-core-canvas:active{cursor:grabbing}
@media(max-width:600px){.topbar{top:12px;right:12px;width:min(54vw,340px);min-width:0}.v9-notification{grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:7px}.v9-group{padding-left:6px}.panel-head{padding-bottom:5px}}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style>
</head>
<body>
<div class="app">
<header class="topbar">
<section class="event-top-card" aria-label="最新事件">
<div class="panel-head"><div class="panel-title"><span class="icon">⌁</span>最新事件</div><span id="v9SyncStatus" class="v9-sync-status">V9 · 等待数据</span></div>
<div class="v9-notification" id="eventList" aria-live="polite">
<section class="v9-group"><div class="v9-group-title">🔸 美股巨头</div><div class="v9-symbols" id="v9Stocks"><span class="v9-nochange">▰ No change ▰</span></div></section>
<section class="v9-group"><div class="v9-group-title">🔸 核心能源</div><div class="v9-symbols" id="v9Core"><span class="v9-nochange">▰ No change ▰</span></div></section>
</div></section></header>
<main class="main-grid"><section class="center-stage" aria-label="中央发光球核心区域"><canvas id="orb-core-canvas" aria-label="动态发光粒子球"></canvas></section></main>
</div>
<script>
/* ORB v3 core-only port. The original library file is preserved unchanged. */

var R=Math.random,PI=Math.PI,cv=document.getElementById("orb-core-canvas"),x=cv.getContext("2d"),W,H,i;
function rs(){var d=window.devicePixelRatio||1,r=cv.getBoundingClientRect();W=Math.max(1,r.width);H=Math.max(1,r.height);cv.width=Math.round(W*d);cv.height=Math.round(H*d);x.setTransform(d,0,0,d,0,0)}
rs();window.addEventListener("resize",rs);if(window.ResizeObserver)new ResizeObserver(rs).observe(cv.parentElement);
var V={spd:.13,zm:.83,ln:2.5,ps:1.6,fl:3};
/* glow sprites */
var SG=[];
for(i=0;i<36;i++){(function(h){var c=document.createElement("canvas");c.width=c.height=64;var g=c.getContext("2d"),q=g.createRadialGradient(32,32,0,32,32,32);q.addColorStop(0,"hsla("+h+",100%,85%,1)");q.addColorStop(.25,"hsla("+h+",100%,62%,.5)");q.addColorStop(1,"hsla("+h+",100%,50%,0)");g.fillStyle=q;g.fillRect(0,0,64,64);SG.push(c)})(i*10)}
function blit(h,px,py,s,al){x.globalAlpha=Math.max(0,Math.min(1,al));x.drawImage(SG[((Math.round(h/10)%36)+36)%36],px-s,py-s,s*2,s*2)}
function hrgb(h){h/=360;var q=.62+1-.62,p2=2*.62-q;function f(t){t=((t%1)+1)%1;return t<1/6?p2+(q-p2)*6*t:t<.5?q:t<2/3?p2+(q-p2)*(2/3-t)*6:p2}return[f(h+1/3)*255,f(h)*255,f(h-1/3)*255]}
/* orb (v1 model): fibonacci sphere, multicolour end dots */
var PAL=[0,28,52,150,190,245,320,280,170],PR=PAL.map(hrgb),N=900,P=[];
for(i=0;i<N;i++){var y=1-2*(i+.5)/N,r=Math.sqrt(1-y*y),th=i*2.399963;P.push({x:r*Math.cos(th),y:y,z:r*Math.sin(th),k:R(),c:Math.floor(R()*PAL.length),m:R()<.2?0:.5+R()*.4})}
function pj(v,cs,sn,cp,spp,cx,cy,Rr){var x1=v[0]*cs+v[2]*sn,z1=-v[0]*sn+v[2]*cs,y2=v[1]*cp-z1*spp,z2=v[1]*spp+z1*cp,f=1+z2*.12;return[cx+x1*Rr*f,cy+y2*Rr*f,z2]}
/* 七根数据流已独立保存至章鱼素材库；网页暂时停用。 */
/* drag */
var rot=0,pitB=.32,dn=false,lx=0,ly=0;
cv.addEventListener("pointerdown",function(e){dn=true;lx=e.clientX;ly=e.clientY;try{cv.setPointerCapture(e.pointerId)}catch(_){} });
window.addEventListener("pointerup",function(){dn=false});
cv.addEventListener("pointermove",function(e){if(!dn)return;rot+=(e.clientX-lx)*.008;pitB=Math.max(-1.2,Math.min(1.2,pitB+(e.clientY-ly)*.006));lx=e.clientX;ly=e.clientY});
var last=0,orbFrame=0;
function frame(ms){var t=ms/1000,dt=Math.max(0,Math.min(.05,t-last));last=t;if(!dn)rot+=dt*V.spd;
var cx=W*.5,cy=H*.5,Rr=Math.max(1,Math.min(W*.38,H*.39)*V.zm),pit=pitB+.1*Math.sin(t*.17),cp=Math.cos(pit),spp=Math.sin(pit);
x.clearRect(0,0,W,H);
var pr=P.map(function(p){var yw=rot*(.8+.4*p.k),q=pj([p.x,p.y,p.z],Math.cos(yw),Math.sin(yw),cp,spp,cx,cy,Rr),u=(q[0]-(cx-Rr))/(2*Rr);q.push(Math.max(0,Math.min(1,(.6-u)/.22)),(q[2]+1)/2);return q});
x.globalCompositeOperation="lighter";x.globalAlpha=1;
var g=x.createRadialGradient(cx,cy,0,cx,cy,Rr*.22);g.addColorStop(0,"rgba(255,225,160,.45)");g.addColorStop(1,"rgba(255,200,100,0)");x.fillStyle=g;x.fillRect(cx-Rr*.22,cy-Rr*.22,Rr*.44,Rr*.44);
x.lineWidth=.6;
pr.forEach(function(q,k){var gw=q[3],tw=Math.pow(Math.sin(t*1.1+k*13.7)*.5+.5,3),a=(.012+.11*tw)*(.35+.65*q[4])*(.45+.55*gw)*V.ln;if(a<.012)return;x.strokeStyle="rgba("+(140+115*gw|0)+","+(185+5*gw|0)+","+(255-185*gw|0)+","+Math.min(a,.5)+")";x.beginPath();x.moveTo(cx+(q[0]-cx)*.1,cy+(q[1]-cy)*.1);x.lineTo(q[0],q[1]);x.stroke()});
/* 七根数据流暂时不在网页绘制；其独立模块保存在章鱼素材库。 */
/* dots */
x.globalAlpha=1;
pr.forEach(function(q,n){var p=P[n],gw=q[3],k=p.k,a=(.25+.5*gw)*(.5+.5*q[4]),b0=140+115*gw,b1=185+5*gw+k*50*gw,b2=255-185*gw,pc=PR[p.c],m=p.m;
x.globalAlpha=1;x.fillStyle="rgba("+(b0+(pc[0]-b0)*m|0)+","+(b1+(pc[1]-b1)*m|0)+","+(b2+(pc[2]-b2)*m|0)+","+a+")";x.beginPath();x.arc(q[0],q[1],(.8+k*2*gw+.5*q[4])*V.ps,0,PI*2);x.fill();
if(k>.45)blit(m>.3?PAL[p.c]:(gw>.5?40:215),q[0],q[1],(4+k*7)*V.ps,.22*(.5+.5*q[4]));
if(n%11==0&&gw>.4){x.globalAlpha=1;x.strokeStyle="rgba(255,200,80,"+(.6*gw)+")";x.lineWidth=.8;x.beginPath();x.arc(q[0],q[1],(4+k*3)*V.ps,0,PI*2);x.stroke()}
});
x.globalAlpha=1;x.globalCompositeOperation="source-over";
orbFrame=requestAnimationFrame(frame)}
orbFrame=requestAnimationFrame(frame);
document.addEventListener("visibilitychange",function(){
if(document.hidden){if(orbFrame){cancelAnimationFrame(orbFrame);orbFrame=0}}
else if(!orbFrame){last=0;orbFrame=requestAnimationFrame(frame)}
});
</script>
<script>
/* Mirror the daily formal-signal list from VEGAS V9's persisted state. */
(function(){
  const STATE_URL="https://raw.githubusercontent.com/MraJJqq/vegas-octopus-v2/main/v9-signals.json";
  const CORE_ORDER=["BTC","HYPE","XAU","CL"];
  const STOCK_ORDER=["AAPL","MSFT","GOOGL","AMZN","NVDA","TSLA","META","INTC","QCOM","AMD","TSM","AVGO","ORCL","ARM","MU","ASML","SNDK","SKHYNIX","MRVL","GLW","HOOD","CBRS","SPCX"];
  const ALLOWED=new Set(CORE_ORDER.concat(STOCK_ORDER));
  const $=id=>document.getElementById(id);
  function symbolName(raw){
    let s=String(raw||"").trim().toUpperCase();
    if(s.endsWith("USDT"))s=s.slice(0,-4);
    if(s==="CLU")s="CL";
    return s;
  }
  function todayBeijing(){
    const parts=new Intl.DateTimeFormat("en-CA",{timeZone:"Asia/Shanghai",year:"numeric",month:"2-digit",day:"2-digit"}).formatToParts(new Date());
    const p={};parts.forEach(x=>{p[x.type]=x.value});
    return p.year+"-"+p.month+"-"+p.day;
  }
  function renderSymbols(targetId,symbols){
    const target=$(targetId);
    if(!target)return;
    target.replaceChildren();
    if(!symbols.length){
      const empty=document.createElement("span");
      empty.className="v9-nochange";
      empty.textContent="▰ No change ▰";
      target.appendChild(empty);
      return;
    }
    symbols.forEach(symbol=>{
      const item=document.createElement("span");
      item.className="v9-symbol";
      item.textContent="▰ "+symbol+" ▰";
      target.appendChild(item);
    });
  }
  function renderMessage(message){
    ["v9Stocks","v9Core"].forEach(id=>{
      const target=$(id);
      if(!target)return;
      target.replaceChildren();
      const item=document.createElement("span");
      item.className="v9-nochange";
      item.textContent=message;
      target.appendChild(item);
    });
  }
  async function fetchStateJson(){
    const response=await fetch(STATE_URL+"?t="+Date.now(),{cache:"no-store"});
    if(!response.ok)throw new Error("公开信号镜像 HTTP "+response.status);
    return await response.json();
  }
  async function refreshV9State(){
    const status=$("v9SyncStatus");
    try{
      const state=await fetchStateJson();
      const daily=state&&state.__daily_formal_signals__;
      if(!daily||!Array.isArray(daily.signals))throw new Error("状态格式无效");
      if(daily.date!==todayBeijing()){
        renderMessage("等待今日扫描");
        if(status)status.textContent="V9 · 等待今日扫描（状态日期 "+String(daily.date||"未知")+"）";
        return;
      }
      const seen=new Set();
      for(const signal of daily.signals){
        if(!signal||signal.formal_signal!==true)continue;
        const s=symbolName(signal.symbol);
        if(ALLOWED.has(s))seen.add(s);
      }
      renderSymbols("v9Stocks",STOCK_ORDER.filter(s=>seen.has(s)));
      renderSymbols("v9Core",CORE_ORDER.filter(s=>seen.has(s)));
      if(status)status.textContent="V9 · 每2小时扫描";
    }catch(error){
      const detail=String(error&&error.message||error).slice(0,70);
      if(status)status.textContent="V9 · 读取失败："+detail;
      renderMessage("读取失败："+detail);
      console.warn("V9 latest-events state unavailable:",error);
    }
  }
  refreshV9State();
  window.setInterval(refreshV9State,15*60*1000);
})();
</script>
</body>
</html>
