<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#02040a">
<title>Vegas 章鱼 · AETHER 3D 数据宇宙</title>
<style>
:root{color-scheme:dark;--text:#e8f5ff;--cyan:#31d9ff}
*{box-sizing:border-box;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;margin:0;overflow:hidden;overscroll-behavior:none;background:#02040a;color:var(--text);font:13px/1.45 Inter,-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
body{position:fixed;inset:0;background:#02040a}
/* 第一层：全页面统一深邃黑暗背景；后续模块不得另建底色层。 */
body::before{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;background:#02040a}
/* 页面容器透明，所有内容叠加在第一层背景之上。 */
.app{position:relative;z-index:1;width:100%;height:100dvh;min-height:0;padding:0;background:transparent;overflow:hidden;overscroll-behavior:none;}
/* 第二层：最新事件悬浮模块。 */
.topbar{position:absolute;z-index:3;top:clamp(12px,2.2vh,28px);right:clamp(12px,2.2vw,32px);width:clamp(150px,22vw,320px);min-width:0;max-height:calc(100dvh - 24px);overflow:hidden;pointer-events:none}
.event-top-card{width:100%;min-width:0;min-height:0;max-height:100%;padding:0;display:flex;flex-direction:column;background:transparent!important;border:0!important;border-radius:0!important;box-shadow:none!important;pointer-events:auto}
.panel-head{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:0 0 7px}
.panel-title{display:flex;align-items:center;gap:7px;font-size:clamp(11px,.8vw,15px);font-weight:750;letter-spacing:.03em}
.panel-title .icon{display:inline-grid;place-items:center;width:clamp(20px,1.45vw,27px);height:clamp(20px,1.45vw,27px);border-radius:7px;background:rgba(35,200,255,.12);border:1px solid rgba(51,206,255,.3);color:var(--cyan)}

.v9-notification{display:flex;flex-direction:column;gap:clamp(8px,1.4vh,20px);flex:1;min-width:0;min-height:0;max-height:calc(100dvh - 76px);overflow:auto;overscroll-behavior:contain}
.v9-group{min-width:0;border-left:1px solid rgba(85,155,214,.18);padding-left:9px}
.v9-group-title{font-size:clamp(9px,.65vw,11px);font-weight:750;color:#a9d9ff;white-space:nowrap;margin-bottom:5px}
.v9-symbols{display:flex;flex-wrap:wrap;align-content:flex-start;gap:4px 7px;min-width:0}
.v9-symbol{font-size:clamp(8px,.62vw,10px);color:#8fe9ff;white-space:nowrap;text-shadow:0 0 8px rgba(49,217,255,.14)}
.v9-nochange{font-size:clamp(8px,.62vw,10px);color:#8ba4be;white-space:nowrap}
/* 第二层：发光球模块；背景透明，不覆盖第一层。 */
.main-grid{position:absolute;z-index:2;inset:0;min-width:0;min-height:0;display:grid;grid-template-columns:minmax(0,1fr);overflow:hidden;background:transparent;pointer-events:none}
.center-stage{position:relative;isolation:isolate;min-width:0;min-height:0;width:100%;height:100%;overflow:hidden;border-radius:0;background:transparent;pointer-events:none}
#orb-core-canvas{position:absolute;inset:0;width:100%;height:100%;display:block;z-index:1;pointer-events:auto;touch-action:pan-y;cursor:grab}
#orb-core-canvas:active{cursor:grabbing}
@media(max-width:600px){.topbar{top:12px;right:12px;width:clamp(132px,42vw,250px);max-height:calc(100dvh - 24px)}.v9-notification{gap:10px;max-height:calc(100dvh - 64px)}.v9-group{padding-left:6px}.panel-head{padding-bottom:5px}.v9-symbols{gap:4px 5px}}

#market-cards-layer{--up:#2ee6a6;--dn:#ff5c7c;--mute:#7f8db0;--ink:#e8f0ff;position:absolute;z-index:2;inset:0;min-width:0;min-height:0;pointer-events:none;overflow:hidden}
#market-cards-layer .mc-columns{position:absolute;top:clamp(66px,10vh,110px);right:auto;bottom:clamp(8px,2vh,28px);left:0;width:clamp(150px,36vw,460px);height:auto;max-height:none;min-width:0;min-height:0;box-sizing:border-box;overflow:visible;pointer-events:auto;background:transparent!important;border:0!important;box-shadow:none!important;backdrop-filter:none!important;-webkit-backdrop-filter:none!important}

#market-cards-layer .mc-side{position:relative;z-index:1;display:flex;flex-direction:column;justify-content:flex-start;align-items:center;gap:clamp(8px,1.2vh,16px);min-width:0;min-height:0;width:100%;height:100%;max-height:100%;box-sizing:border-box;overflow-x:hidden;overflow-y:auto;overscroll-behavior:none;touch-action:pan-y; padding-block:clamp(8px,2vh,28px);scrollbar-width:none;-ms-overflow-style:none;pointer-events:auto;cursor:default;background:transparent!important;border:0!important;box-shadow:none!important;backdrop-filter:none!important;-webkit-backdrop-filter:none!important}#market-cards-layer .mc-side::-webkit-scrollbar{display:none;width:0;height:0}
#market-cards-layer .mc-slot{position:relative;flex:0 0 auto;perspective:900px;width:min(100%,clamp(126px,18vw,238px));min-width:0;max-width:100%;box-sizing:border-box;padding:5px 4px 16px;pointer-events:auto;opacity:var(--mc-page-opacity,1);filter:none;transition:transform .12s linear,opacity .28s ease;transform:translateZ(0) scale(var(--mc-focus-scale,1));transform-origin:center center;backface-visibility:hidden;}
#market-cards-layer .mc-float{transform-style:preserve-3d;animation:mc-bob 5.5s ease-in-out infinite alternate;animation-delay:var(--d)}
@keyframes mc-bob{0%{transform:translateY(0) rotateY(-5deg) rotateX(2deg)}100%{transform:translateY(-7px) rotateY(5deg) rotateX(-2deg)}}
#market-cards-layer .mc-gshadow{position:absolute;left:14%;right:14%;bottom:0;height:14px;border-radius:50%;background:radial-gradient(closest-side,rgba(0,0,0,.65),transparent);filter:blur(5px);animation:mc-sh 5.5s ease-in-out infinite alternate;animation-delay:var(--d)}
@keyframes mc-sh{0%{transform:scale(1);opacity:.9}100%{transform:scale(.82);opacity:.5}}
#market-cards-layer .mc-card{--mc-c:var(--up);position:relative;transform-style:preserve-3d;transform:rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));transition:transform .14s ease-out;border-radius:22px;padding:clamp(10px,1.1vw,15px);min-height:clamp(122px,17vh,172px);touch-action:pan-y;cursor:default}

#market-cards-layer .mc-g1,#market-cards-layer .mc-g2{position:absolute;inset:0;border-radius:inherit;border:1.5px solid var(--mc-c);pointer-events:none;transition:border-color .4s}
#market-cards-layer .mc-g1{transform:translateZ(-18px);opacity:.55}
#market-cards-layer .mc-g2{transform:translateZ(-36px);opacity:.25}
#market-cards-layer .mc-gl{position:absolute;inset:0;border-radius:inherit;pointer-events:none;opacity:0;transform:translateZ(52px);background:radial-gradient(circle at var(--mx,50%) var(--my,50%),rgba(255,255,255,.28),transparent 55%);transition:opacity .18s ease}
#market-cards-layer .mc-card.hot .mc-gl{opacity:1}
#market-cards-layer .mc-l1,#market-cards-layer .mc-l2,#market-cards-layer .mc-l3,#market-cards-layer .mc-l4{position:relative}
#market-cards-layer .mc-l1{transform:translateZ(14px)}
#market-cards-layer .mc-l2{transform:translateZ(30px)}
#market-cards-layer .mc-l3{transform:translateZ(39px)}
#market-cards-layer .mc-l4{transform:translateZ(50px)}

#market-cards-layer .mc-coin{flex:0 0 27px;width:27px;height:27px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:12px;color:#07101f;background:var(--mc-c);box-shadow:0 0 16px -2px var(--mc-c);transition:background .4s}
#market-cards-layer .mc-sym{font-size:clamp(12px,1vw,15px);font-weight:700;white-space:nowrap}
#market-cards-layer .mc-sym small{font-size:10px;color:var(--mute);font-weight:500;margin-left:4px}
#market-cards-layer .mc-price{font-size:clamp(19px,1.8vw,27px);font-weight:700;margin:9px 0 4px;font-variant-numeric:tabular-nums;transition:color .3s;white-space:nowrap}
#market-cards-layer .mc-price.flash{color:var(--mc-c)}
#market-cards-layer .mc-pct{display:inline-block;padding:2px 8px;border-radius:99px;font-size:11px;font-weight:700;color:#07101f;background:var(--mc-c);transition:background .4s}
#market-cards-layer .mc-kline{display:block;width:100%;height:34px;margin-top:7px}
#market-cards-layer .mc-hl{margin-top:5px;font-size:10px;color:var(--mute);font-variant-numeric:tabular-nums;white-space:nowrap}
#market-cards-layer .mc-hl span{color:var(--ink);margin:0 5px 0 2px}
@media(max-width:700px){#market-cards-layer .mc-columns{top:clamp(56px,12vh,112px);bottom:clamp(8px,1.5vh,20px);width:48vw}#market-cards-layer .mc-side{gap:clamp(8px,1.5vh,10px)}#market-cards-layer .mc-slot{width:min(100%,clamp(126px,43vw,190px));padding:3px 2px 12px}#market-cards-layer .mc-card{padding:9px;border-radius:16px;min-height:clamp(112px,15vh,145px)}#market-cards-layer .mc-sym small{font-size:9px}#market-cards-layer .mc-price{font-size:clamp(17px,4.4vw,23px)}#market-cards-layer .mc-hl{font-size:9px}}
@media(prefers-reduced-motion:reduce){#market-cards-layer .mc-float,#market-cards-layer .mc-gshadow{animation:none}}

</style>

<script>
/* 第二层：最新事件模块，读取正式信号状态。 */
(function(){
  const STATE_URL="https://raw.githubusercontent.com/MraJJqq/vegas-octopus-v2/main/v9-signals.json";
  const CORE_ORDER=["BTC","HYPE","XAU","CL"];
  const STOCK_ORDER=["AAPL","MSFT","GOOGL","AMZN","NVDA","TSLA","META","INTC","QCOM","AMD","TSM","AVGO","ORCL","ARM","MU","ASML","SNDK","SKHYNIX","MRVL","GLW","HOOD","CBRS","SPCX"];
  const ALLOWED=new Set(CORE_ORDER.concat(STOCK_ORDER));
  const $=id=>document.getElementById(id);
  function symbolName(raw){
    let s=String(raw||"").trim().toUpperCase();
    if(s.endsWith("USDT"))s=s.slice(0,-4);
    if(s==="CLU")s="CL";
    return s;
  }
  function todayBeijing(){
    const parts=new Intl.DateTimeFormat("en-CA",{timeZone:"Asia/Shanghai",year:"numeric",month:"2-digit",day:"2-digit"}).formatToParts(new Date());
    const p={};parts.forEach(x=>{p[x.type]=x.value});
    return p.year+"-"+p.month+"-"+p.day;
  }
  function renderSymbols(targetId,symbols){
    const target=$(targetId);
    if(!target)return;
    target.replaceChildren();
    if(!symbols.length){
      const empty=document.createElement("span");
      empty.className="v9-nochange";
      empty.textContent="▰ No change ▰";
      target.appendChild(empty);
      return;
    }
    symbols.forEach(symbol=>{
      const item=document.createElement("span");
      item.className="v9-symbol";
      item.textContent="▰ "+symbol+" ▰";
      target.appendChild(item);
    });
  }
  function renderMessage(message){
    ["v9Stocks","v9Core"].forEach(id=>{
      const target=$(id);
      if(!target)return;
      target.replaceChildren();
      const item=document.createElement("span");
      item.className="v9-nochange";
      item.textContent=message;
      target.appendChild(item);
    });
  }
  async function fetchStateJson(){
    const response=await fetch(STATE_URL+"?t="+Date.now(),{cache:"no-store"});
    if(!response.ok)throw new Error("公开信号镜像 HTTP "+response.status);
    return await response.json();
  }
  async function refreshV9State(){
    try{
      const state=await fetchStateJson();
      const daily=state&&state.__daily_formal_signals__;
      if(!daily||!Array.isArray(daily.signals))throw new Error("状态格式无效");
      if(daily.date!==todayBeijing()){
        window.VegasFormalSignalSymbols=[];
        if(typeof window.VegasApplyFormalSignals==="function")window.VegasApplyFormalSignals();
        renderMessage("等待今日扫描");
        return;
      }
      const seen=new Set();
      for(const signal of daily.signals){
        if(!signal||signal.formal_signal!==true)continue;
        const s=symbolName(signal.symbol);
        if(ALLOWED.has(s))seen.add(s);
      }
      window.VegasFormalSignalSymbols=Array.from(seen);
      if(typeof window.VegasApplyFormalSignals==="function")window.VegasApplyFormalSignals();
      renderSymbols("v9Stocks",STOCK_ORDER.filter(s=>seen.has(s)));
      renderSymbols("v9Core",CORE_ORDER.filter(s=>seen.has(s)));
    }catch(error){
      window.VegasFormalSignalSymbols=[];
      if(typeof window.VegasApplyFormalSignals==="function")window.VegasApplyFormalSignals();
      const detail=String(error&&error.message||error).slice(0,70);
      renderMessage("读取失败："+detail);
      console.warn("V9 latest-events state unavailable:",error);
    }
  }
  refreshV9State();
  window.setInterval(refreshV9State,15*60*1000);
})();
</script>

      return {start,end};
    }
    // Keep a valid, non-empty viewport even when the requested time window
    // temporarily falls outside the currently loaded candles.
    if(state.endTime<first) return {start:0,end:Math.min(length,count)};
    if(state.startTime>last) return {start:Math.max(0,length-count),end:length};
    start=data.findIndex(c=>c.t>=state.startTime);
    if(start<0) start=length-1;
    end=data.findIndex(c=>c.t>state.endTime);
    if(end<0) end=length;
    start=Math.max(0,Math.min(length-1,start));
    end=Math.max(start+1,Math.min(length,end));
    if(end-start>count) end=start+count;
    else if(end-start<count) start=Math.max(0,end-count);
    return {start,end};
  }
  function fitCanvas() {
    const rect=canvas.getBoundingClientRect();
    state.dpr=Math.max(1,window.devicePixelRatio||1);
    state.width=Math.max(1,rect.width); state.height=Math.max(1,rect.height);
    const pixelW=Math.round(state.width*state.dpr),pixelH=Math.round(state.height*state.dpr);
    if(canvas.width!==pixelW) canvas.width=pixelW;
    if(canvas.height!==pixelH) canvas.height=pixelH;
    ctx.setTransform(state.dpr,0,0,state.dpr,0,0);
    draw();
  }
  function draw() {
    if (overlay.hidden) return;
    const W=state.width,H=state.height;
    ctx.clearRect(0,0,W,H);
    state.hitSegments=[];
    const data=state.candles;
    if(!data.length) return;
    const {start,end}=visibleIndices(), rows=data.slice(start,end);
    if(!rows.length) return;
    const pad={left:8,right:8,top:38,bottom:12};
    const plotW=Math.max(1,(W-pad.left-pad.right)*0.86), plotH=Math.max(1,H-pad.top-pad.bottom); // 默认右侧保留约14%空白，避免最新K线贴边
    const step=plotW/rows.length, bodyW=Math.max(1,Math.min(8,step*.62));
    let min=Infinity,max=-Infinity;
    rows.forEach(c=>{min=Math.min(min,c.l);max=Math.max(max,c.h);});
    state.series.forEach(s=>{for(let i=start;i<end;i++){const v=s.values[i];if(Number.isFinite(v)){min=Math.min(min,v);max=Math.max(max,v);}}});
    if(!Number.isFinite(min)||!Number.isFinite(max)) return;
    const margin=(max-min)*.055 || Math.max(max*.004,0.0001); min-=margin; max+=margin;
    const xAt=i=>pad.left+(i-start+.5)*step;
    // Vertical panning is bounded so repeated diagonal drags cannot move all candles off-canvas.
    const safeShift=Math.max(-H*.32,Math.min(H*.32,state.priceShift));
    state.priceShift=safeShift;
    const yAt=v=>pad.top+(max-v)/(max-min)*plotH+safeShift;

    rows.forEach((c,j)=>{
      const i=start+j,x=xAt(i),up=c.c>=c.o,color=up?'#2ee6a6':'#ff5c7c';
      ctx.strokeStyle=color;ctx.lineWidth=Math.max(1,Math.min(1.5,step*.18));
      ctx.beginPath();ctx.moveTo(x,yAt(c.h));ctx.lineTo(x,yAt(c.l));ctx.stroke();
      ctx.fillStyle=color;
      const y1=yAt(Math.max(c.o,c.c)),y2=yAt(Math.min(c.o,c.c));
      ctx.fillRect(x-bodyW/2,y1,bodyW,Math.max(1,y2-y1));
      state.hitSegments.push({x1:x,y1:yAt(c.h),x2:x,y2:yAt(c.l)});
      state.hitSegments.push({x1:x-bodyW/2,y1:y1,x2:x+bodyW/2,y2:y2});
    });
    state.series.forEach(s=>{
      ctx.strokeStyle=s.color;ctx.lineWidth=s.width;ctx.globalAlpha=.92;ctx.beginPath();
      let begun=false;
      for(let i=start;i<end;i++){
        const value=s.values[i];
        if(!Number.isFinite(value)){begun=false;continue;}
        const x=xAt(i),y=yAt(value);
        if(!begun){ctx.moveTo(x,y);begun=true;}else ctx.lineTo(x,y);
      }
      ctx.stroke();ctx.globalAlpha=1;
    });
  }
  async function loadData(isRefresh) {
    const generation=state.generation;
    const request=++state.dataRequest;
    try {
      let apiSymbol=state.symbol;
      if(state.stock) apiSymbol=await resolveStock(state.symbol);
      const rows=normalize(await getJson(candlePath(apiSymbol,state.stock)));
      if(generation!==state.generation || request!==state.dataRequest || overlay.hidden) return;
      if(rows.length<2) throw new Error('交易所返回的4H K线不足');
      writeCandleCache(state.symbol,rows);
      if(isRefresh && state.candles.length) {
        const oldStart=state.startTime,oldEnd=state.endTime;
        state.candles=normalize(state.candles.concat(rows));
        rebuildSeries();
        state.startTime=oldStart;
        state.endTime=oldEnd;
      } else {
        state.candles=rows;
        state.endTime=rows[rows.length-1].t;
        state.startTime=state.endTime-90*24*60*60*1000;
        rebuildSeries();
      }
      const range=visibleIndices();
      if(range.end>range.start) state.viewCount=range.end-range.start;
      draw();
      state.apiSymbol=apiSymbol;
      if(!isRefresh && rows.length >= 900) loadOlderHistory(generation,apiSymbol);
    } catch(error) {
      if(generation!==state.generation || request!==state.dataRequest || overlay.hidden) return;
      console.error('[Vegas Fifth Layer]',error);
    }
  }
  async function loadOlderHistory(generation, apiSymbol) {
    if(state.historyLoading || !state.candles.length) return;
    state.historyLoading=true;
    state.historyLoadingGeneration=generation;
    try {
      // Bitget caps each response at 1000 bars; render the newest page first,
      // then fetch three older pages in the background.
      for(let page=0;page<3;page++) {
        if(generation!==state.generation || overlay.hidden) return;
        const oldest=state.candles[0]?.t;
        if(!Number.isFinite(oldest) || oldest<=0) break;
        const older=normalize(await getJson(candlePath(apiSymbol, state.stock, oldest-1)));
        if(generation!==state.generation || overlay.hidden) return;
        if(!older.length) break;
        const before=state.candles.length;
        state.candles=normalize(older.concat(state.candles));
        if(state.candles.length<=before) break;
        rebuildSeries();
      }
      if(generation===state.generation && !overlay.hidden) {
        draw();
      }
    } catch(error) {
      console.warn('[Vegas Fifth Layer] 历史K线补载失败：',error);
    } finally {
      if(state.historyLoadingGeneration===generation) {
        state.historyLoading=false;
        state.historyLoadingGeneration=0;
      }
    }
  }
  function open(card) {
    if(!card || !card.dataset) return;
    const symbol=String(card.dataset.symbol||'').trim().toUpperCase();
    if(!symbol) return;
    // Invalidate any pending candle/history requests from the previously opened card.
    state.generation++;
    state.dataRequest++;
    state.symbol=symbol;
    state.stock=STOCKS.has(symbol);
    state.apiSymbol='';
    state.candles=[];state.series=[];state.startTime=null;state.endTime=null;state.viewCount=540;state.drag=null;state.panX=0;state.priceShift=0;state.historyLoading=false;state.historyLoadingGeneration=0;
    overlay.hidden=false;
    fitCanvas();
    showCachedCandles(symbol);
    loadData(false);
    if(state.timer) clearInterval(state.timer);
    state.timer=window.setInterval(()=>{if(!overlay.hidden)loadData(true);},15000);
  }
  function close() {
    overlay.hidden=true;state.drag=null;state.generation++;state.historyLoading=false;state.historyLoadingGeneration=0;
    if(state.timer) clearInterval(state.timer);
    state.timer=0;
  }
  function changeZoom(delta) {
    if(!state.candles.length) return;
    const {start,end}=visibleIndices();
    const oldCount=Math.max(1,end-start);
    const next=Math.max(12,Math.min(state.candles.length,Math.round(oldCount*(delta<0?.82:1.22))));
    if(next===oldCount) return;
    // Anchor zoom at the right edge of the current viewport, clamped to loaded data.
    const anchorIndex=Math.max(0,Math.min(state.candles.length-1,end-1));
    const nextStart=Math.max(0,anchorIndex-next+1);
    const actualCount=anchorIndex-nextStart+1;
    state.viewCount=actualCount;
    state.startTime=state.candles[nextStart].t;
    state.endTime=state.candles[anchorIndex].t;
    draw();
  }
  function pointerDown(e) {
    if(overlay.hidden || !state.candles.length) return;
    state.drag={x:e.clientX,y:e.clientY,baseStart:state.startTime,baseEnd:state.endTime,basePriceShift:state.priceShift,moved:false};
    try{canvas.setPointerCapture(e.pointerId);}catch(_){}
  }
  function pointerMove(e) {
    if(!state.drag || !state.candles.length) return;
    const dx=e.clientX-state.drag.x,dy=e.clientY-state.drag.y;
    if(Math.hypot(dx,dy)>3) state.drag.moved=true;
    if(!state.drag.moved) return;
    // 横向拖动时图表内容跟随指针：向右拖动浏览更早行情；纵向仍可自由平移。
    const {start,end}=visibleIndices();
    const count=Math.max(1,end-start);
    const plotW=Math.max(1,(state.width-16)*0.86);
    const step=plotW/count;
    // Two-axis free pan: horizontal motion moves the time window; vertical motion moves price levels.
    // Keep time calculations anchored to pointer-down to avoid accumulated drift over repeated moves.
    const timeShift=-dx*(4*60*60*1000)/Math.max(.01,step);
    state.startTime=state.drag.baseStart+timeShift;
    state.endTime=state.drag.baseEnd+timeShift;
    state.priceShift=Math.max(-state.height*.32,Math.min(state.height*.32,state.drag.basePriceShift+dy));
    draw();
    const oldest=state.candles[0]?.t;
    if(Number.isFinite(oldest) && state.startTime<oldest+100*4*60*60*1000 && state.apiSymbol) {
      loadOlderHistory(state.generation,state.apiSymbol);
    }
  }
  function pointDistance(p,s) {
    const dx=s.x2-s.x1,dy=s.y2-s.y1,len=dx*dx+dy*dy;
    const t=len?Math.max(0,Math.min(1,((p.x-s.x1)*dx+(p.y-s.y1)*dy)/len)):0;
    return Math.hypot(p.x-(s.x1+t*dx),p.y-(s.y1+t*dy));
  }
  function pointerUp(e) {
    if(!state.drag) return;
    const moved=state.drag.moved;state.drag=null;
    if(!moved) {
      const rect=canvas.getBoundingClientRect();
      const p={x:e.clientX-rect.left,y:e.clientY-rect.top};
      const nearest=state.hitSegments.reduce((best,s)=>Math.min(best,pointDistance(p,s)),Infinity);
      if(nearest>12) close();
    }
  }
  // Capture clicks before page-level handlers; pointer events also cover touch devices.
  function findCard(event) {
    const path=typeof event.composedPath==='function'?event.composedPath():[];
    for(const node of path) if(node&&node.matches&&node.matches(CARD_SELECTOR)) return node;
    const target=event.target;
    return target&&target.closest?target.closest(CARD_SELECTOR):null;
  }
  document.addEventListener('click',event=>{
    if(!overlay.hidden) return;
    const card=findCard(event);
    if(!card) return;
    event.preventDefault();
    event.stopPropagation();
    open(card);
  },true);
  document.addEventListener('pointerup',event=>{
    if(!overlay.hidden) return;
    const card=findCard(event);
    if(!card) return;
    // iOS and touch browsers can suppress click after gesture handling.
    if(event.pointerType==='touch') open(card);
  },true);
  canvas.addEventListener('pointerdown',pointerDown);
  canvas.addEventListener('pointermove',pointerMove);
  canvas.addEventListener('pointerup',pointerUp);
  canvas.addEventListener('pointercancel',()=>{state.drag=null;});
  canvas.addEventListener('wheel',event=>{
    if(overlay.hidden) return;
    event.preventDefault();changeZoom(event.deltaY);
  },{passive:false});
  overlay.addEventListener('click',event=>{if(event.target===overlay)close();});
  document.addEventListener('keydown',event=>{if(event.key==='Escape'&&!overlay.hidden)close();});
  window.addEventListener('resize',fitCanvas,{passive:true});
  if(window.ResizeObserver) new ResizeObserver(fitCanvas).observe(canvas);
  window.VegasFifthLayer={open,close,refresh:()=>loadData(true),getState:()=>({symbol:state.symbol,visible:!overlay.hidden,candles:state.candles.length})};
  window.__VEGAS_FIFTH_LAYER_READY__=true;
  window.setTimeout(()=>{if(!document.hidden)warmCandleCache();},350);
  console.info('[Vegas Fifth Layer] initialized');
})();
</script>
</body>
