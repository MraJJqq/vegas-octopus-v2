<script>
/* K线依赖异步加载；点击桥接已提前就绪。 */
(function(){
 const sources=[
  'https://cdn.jsdelivr.net/npm/lightweight-charts@5.2.1/dist/lightweight-charts.standalone.production.js',
  'https://unpkg.com/lightweight-charts@5.2.1/dist/lightweight-charts.standalone.production.js'
 ];
 function loadSource(index){
  if(index>=sources.length){
   if(typeof window.VegasLayer5BridgeFailed==='function')window.VegasLayer5BridgeFailed();
   return;
  }
  const script=document.createElement('script');
  script.src=sources[index];
  script.onload=function(){
   const app=document.createElement('script');
   app.src='./assets/js/layer5-vegas-kline.js?v=20261030-35';
   app.onerror=function(){console.error('[Vegas Layer 5] K-line module failed to load');if(typeof window.VegasLayer5BridgeFailed==='function')window.VegasLayer5BridgeFailed();};
   document.body.appendChild(app);
  };
  script.onerror=function(){script.remove();loadSource(index+1);};
  document.head.appendChild(script);
 }
 loadSource(0);
})();
</script>


</body>
