<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#02040a">
<title>Vegas 章鱼 · AETHER 3D 数据宇宙</title>
<style>
:root{color-scheme:dark;--text:#e8f5ff;--cyan:#31d9ff}
*{box-sizing:border-box;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#02040a;color:var(--text);font:13px/1.45 Inter,-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
body{position:fixed;inset:0;background:#02040a}
/* 第一层：全页面统一深邃黑暗背景；后续模块不得另建底色层。 */
body::before{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;background:#02040a}
/* 页面容器透明，所有内容叠加在第一层背景之上。 */
.app{position:relative;z-index:1;width:100%;height:100dvh;min-height:0;padding:0;background:transparent;overflow:hidden}
/* 第二层：最新事件悬浮模块。 */
.topbar{position:absolute;z-index:3;top:clamp(12px,2.2vh,28px);right:clamp(12px,2.2vw,32px);width:clamp(150px,22vw,320px);min-width:0;max-height:calc(100dvh - 24px);overflow:hidden;pointer-events:none}
.event-top-card{width:100%;min-width:0;min-height:0;max-height:100%;padding:0;display:flex;flex-direction:column;background:transparent!important;border:0!important;border-radius:0!important;box-shadow:none!important;pointer-events:auto}
.panel-head{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:0 0 7px}
.panel-title{display:flex;align-items:center;gap:7px;font-size:clamp(11px,.8vw,15px);font-weight:750;letter-spacing:.03em}
.panel-title .icon{display:inline-grid;place-items:center;width:clamp(20px,1.45vw,27px);height:clamp(20px,1.45vw,27px);border-radius:7px;background:rgba(35,200,255,.12);border:1px solid rgba(51,206,255,.3);color:var(--cyan)}

.v9-notification{display:flex;flex-direction:column;gap:clamp(8px,1.4vh,20px);flex:1;min-width:0;min-height:0;max-height:calc(100dvh - 76px);overflow:auto;overscroll-behavior:contain}
.v9-group{min-width:0;border-left:1px solid rgba(85,155,214,.18);padding-left:9px}
.v9-group-title{font-size:clamp(9px,.65vw,11px);font-weight:750;color:#a9d9ff;white-space:nowrap;margin-bottom:5px}
.v9-symbols{display:flex;flex-wrap:wrap;align-content:flex-start;gap:4px 7px;min-width:0}
.v9-symbol{font-size:clamp(8px,.62vw,10px);color:#8fe9ff;white-space:nowrap;text-shadow:0 0 8px rgba(49,217,255,.14)}
.v9-nochange{font-size:clamp(8px,.62vw,10px);color:#8ba4be;white-space:nowrap}
/* 第二层：发光球模块；背景透明，不覆盖第一层。 */
.main-grid{position:absolute;z-index:2;inset:0;min-width:0;min-height:0;display:grid;grid-template-columns:minmax(0,1fr);overflow:hidden;background:transparent;pointer-events:none}
.center-stage{position:relative;isolation:isolate;min-width:0;min-height:0;width:100%;height:100%;overflow:hidden;border-radius:0;background:transparent;pointer-events:none}
#orb-core-canvas{position:absolute;inset:0;width:100%;height:100%;display:block;z-index:1;pointer-events:auto;touch-action:pan-y;cursor:grab}
#orb-core-canvas:active{cursor:grabbing}
@media(max-width:600px){.topbar{top:12px;right:12px;width:clamp(132px,42vw,250px);max-height:calc(100dvh - 24px)}.v9-notification{gap:10px;max-height:calc(100dvh - 64px)}.v9-group{padding-left:6px}.panel-head{padding-bottom:5px}.v9-symbols{gap:4px 5px}}

#market-cards-layer{--bg:#02040a;--ink:#e8f0ff;--mute:#7f8db0;--up:#2ee6a6;--dn:#ff5c7c;position:absolute;z-index:2;inset:0;min-width:0;min-height:0;overflow:hidden;pointer-events:none;color:var(--ink);font-family:'Chakra Petch',ui-sans-serif,system-ui,-apple-system,'PingFang SC',sans-serif}
#market-cards-layer #market-stage{position:absolute;inset:0;pointer-events:none}
#market-cards-layer .pos{position:absolute;left:0;top:0;will-change:transform;cursor:pointer;pointer-events:auto}
#market-cards-layer .card{--c:var(--up);position:absolute;inset:0;border-radius:.9em;padding:.55em .75em;display:grid;grid-template-columns:auto 1fr auto;grid-template-rows:1fr auto;column-gap:.5em;row-gap:.2em;align-items:center;isolation:isolate}
#market-cards-layer .card.dn{--c:var(--dn)}
#market-cards-layer .bg{position:absolute;inset:0;border-radius:inherit;background:linear-gradient(145deg,rgba(255,255,255,.15),rgba(255,255,255,.04));border:1px solid rgba(255,255,255,.2);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);box-shadow:var(--sh),inset 0 1px 0 rgba(255,255,255,.25);pointer-events:none}
#market-cards-layer .bg::after{content:"";position:absolute;inset:0;border-radius:inherit;background:rgba(14,20,38,.9);border:1px solid rgba(255,255,255,.5);box-shadow:0 44px 60px -18px rgba(0,0,0,.95),0 0 34px -6px var(--c);opacity:var(--hv,0);pointer-events:none}
#market-cards-layer .gl{position:absolute;inset:0;border-radius:inherit;pointer-events:none;opacity:var(--hv,0);background:radial-gradient(circle at var(--mx,50%) var(--my,50%),rgba(255,255,255,.26),transparent 55%)}
#market-cards-layer .dim{position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:var(--bg);opacity:0}
#market-cards-layer .coin,#market-cards-layer .sym,#market-cards-layer .price,#market-cards-layer .spark,#market-cards-layer .pct{position:relative;min-width:0}
#market-cards-layer .coin{width:1.8em;height:1.8em;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:.9em;color:#07101f;background:var(--c);box-shadow:0 0 .9em -.15em var(--c)}
#market-cards-layer .sym{font-weight:700;line-height:1.1;white-space:nowrap}
#market-cards-layer .sym small{display:block;font-size:.62em;color:var(--mute);font-weight:500}
#market-cards-layer .price{font-size:.95em;font-weight:700;font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap;transition:color .3s}
#market-cards-layer .price.flash{color:var(--c)}
#market-cards-layer .spark{grid-column:1/3;width:100%;height:1.5em;overflow:visible}
#market-cards-layer .spark .ln{fill:none;stroke:var(--c);stroke-width:1.5;vector-effect:non-scaling-stroke}
#market-cards-layer .spark .ar{fill:var(--c);opacity:.14}
#market-cards-layer .pct{font-size:.8em;font-weight:700;color:var(--c);font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
@media(prefers-reduced-motion:reduce){#market-cards-layer .pos{will-change:auto}}

<script>
/* 第二层：最新事件模块，读取正式信号状态。 */
(function(){
  const STATE_URL="https://raw.githubusercontent.com/MraJJqq/vegas-octopus-v2/main/v9-signals.json";
  const CORE_ORDER=["BTC","HYPE","XAU","CL"];
  const STOCK_ORDER=["AAPL","MSFT","GOOGL","AMZN","NVDA","TSLA","META","INTC","QCOM","AMD","TSM","AVGO","ORCL","ARM","MU","ASML","SNDK","SKHYNIX","MRVL","GLW","HOOD","CBRS","SPCX"];
  const ALLOWED=new Set(CORE_ORDER.concat(STOCK_ORDER));
  const $=id=>document.getElementById(id);
  function symbolName(raw){
    let s=String(raw||"").trim().toUpperCase();
    if(s.endsWith("USDT"))s=s.slice(0,-4);
    if(s==="CLU")s="CL";
    return s;
  }
  function todayBeijing(){
    const parts=new Intl.DateTimeFormat("en-CA",{timeZone:"Asia/Shanghai",year:"numeric",month:"2-digit",day:"2-digit"}).formatToParts(new Date());
    const p={};parts.forEach(x=>{p[x.type]=x.value});
    return p.year+"-"+p.month+"-"+p.day;
  }
  function renderSymbols(targetId,symbols){
    const target=$(targetId);
    if(!target)return;
    target.replaceChildren();
    if(!symbols.length){
      const empty=document.createElement("span");
      empty.className="v9-nochange";
      empty.textContent="▰ No change ▰";
      target.appendChild(empty);
      return;
    }
    symbols.forEach(symbol=>{
      const item=document.createElement("span");
      item.className="v9-symbol";
      item.textContent="▰ "+symbol+" ▰";
      target.appendChild(item);
    });
  }
  function renderMessage(message){
    ["v9Stocks","v9Core"].forEach(id=>{
      const target=$(id);
      if(!target)return;
      target.replaceChildren();
      const item=document.createElement("span");
      item.className="v9-nochange";
      item.textContent=message;
      target.appendChild(item);
    });
  }
  async function fetchStateJson(){
    const response=await fetch(STATE_URL+"?t="+Date.now(),{cache:"no-store"});
    if(!response.ok)throw new Error("公开信号镜像 HTTP "+response.status);
    return await response.json();
  }
  async function refreshV9State(){
    try{
      const state=await fetchStateJson();
      const daily=state&&state.__daily_formal_signals__;
      if(!daily||!Array.isArray(daily.signals))throw new Error("状态格式无效");
      if(daily.date!==todayBeijing()){
        renderMessage("等待今日扫描");
        return;
      }
      const seen=new Set();
      for(const signal of daily.signals){
        if(!signal||signal.formal_signal!==true)continue;
        const s=symbolName(signal.symbol);
        if(ALLOWED.has(s))seen.add(s);
      }
      renderSymbols("v9Stocks",STOCK_ORDER.filter(s=>seen.has(s)));
      renderSymbols("v9Core",CORE_ORDER.filter(s=>seen.has(s)));
    }catch(error){
      const detail=String(error&&error.message||error).slice(0,70);
      renderMessage("读取失败："+detail);
      console.warn("V9 latest-events state unavailable:",error);
    }
  }
  refreshV9State();
  window.setInterval(refreshV9State,15*60*1000);
})();
</script>

}}));
function qAt(k,t){const {th,cum}=ARC[k],sl=t*cum[120];let i=1;while(i<120&&cum[i]<sl)i++;return-th+2*th*((i-1)+(sl-cum[i-1])/(cum[i]-cum[i-1]||1))/120}
function homeOf(o){const q=qAt(o.k,o.t),sg=o.side?1:-1,j=1+o.jr*.03,a=RX[o.k]*j,b=RY[o.k]*j;return{q,x:Cx+sg*a*Math.cos(q),y:Cy+b*Math.sin(q),tx:-sg*a*Math.sin(q),ty:b*Math.cos(q)}}
function relax(){for(let it=0;it<90;it++){const hm=C.map(homeOf),mv=C.map(()=>0);for(let i=0;i<C.length;i++)for(let j=i+1;j<C.length;j++){if(C[i].side!==C[j].side)continue;const dx=hm[i].x-hm[j].x,dy=hm[i].y-hm[j].y,ox=w*1.22-Math.abs(dx),oy=h*1.4-Math.abs(dy);if(ox<=0||oy<=0)continue;const px=ox/(w*1.22)<oy/(h*1.4)?Math.sign(dx||1)*ox:0,py=px?0:Math.sign(dy||1)*oy;for(const [n,f] of [[i,.5],[j,-.5]])mv[n]+=f*(px*hm[n].tx+py*hm[n].ty)/(Math.hypot(hm[n].tx,hm[n].ty)||1)}C.forEach((o,n)=>{o.t=Math.min(.98,Math.max(.02,o.t+mv[n]*.6/ARC[o.k].cum[120]))})}}
function layout(){geom();relax();for(const o of C){const m=homeOf(o),st=o.pos.style;o.ox=m.x-w/2;o.oy=m.y-h/2;o.fx=Math.sin(m.q)*10;o.fy=-(o.side?1:-1)*12;st.width=w+'px';st.height=h+'px';st.fontSize=w/12.4+'px'}}
layout();window.addEventListener('resize',layout,{passive:true});
let tx=0,ty=0,cx=0,cy=0,last=0;
window.addEventListener('pointermove',e=>{tx=e.clientX/W-.5;ty=e.clientY/H-.5},{passive:true});
const reduced=window.matchMedia('(prefers-reduced-motion:reduce)').matches;
function frame(t){
 const dt=reduced?0:Math.min(.05,(t-last)/1000||0);last=t;
 const E=r=>1-Math.exp(-dt*r),kIn=E(9),kOut=E(6),kT=E(12),kS=E(10),kp=E(4),Ax=w*.075,Ay=h*.2;
 cx+=(tx-cx)*kp;cy+=(ty-cy)*kp;
 for(const o of C){const st=o.pos.style;o.hv+=((o.on?1:0)-o.hv)*(o.on?kIn:kOut);if(!o.on&&o.hv<.002)o.hv=0;
 const e=o.hv*o.hv*(3-2*o.hv),a=1-e;o.u+=dt*a;const u=o.u,d=.5+.5*Math.sin(u*o.wd+o.pd),Sd=.88+.24*d,St=Sd+(1.65-Sd)*e,kc=St/Sd;
 const X=o.ox+Ax*(Math.sin(u*o.w1+o.p1)+.4*Math.sin(u*o.w3+o.p3))+cx*(d-.5)*50,Y=o.oy+Ay*(Math.sin(u*o.w2+o.p2)+.4*Math.cos(u*o.w3*1.3+o.p1))+cy*(d-.5)*30;
 let fx=0,fy=0;if(e>0){const gx=w*St/2+4,gy=h*St/2+4,mx=X+w/2,my=Y+h/2;fx=Math.max(gx-mx,0)+Math.min(W-gx-mx,0);fy=Math.max(gy-my,0)+Math.min(H-gy-my,0)}
 o.sx+=(fx-o.sx)*kS;o.sy+=(fy-o.sy)*kS;o.rx+=(o.hx-o.rx)*kT;o.ry+=(o.hy-o.ry)*kT;
 const bob=Math.sin(u*o.w5+o.p5)*h*.08,b2=Math.sin(u*1.3+o.p1)*.012*a;st.transform='translate3d('+(X+o.sx)+'px,'+(Y+o.sy+bob)+'px,0) scale('+Sd+')';
 o.card.style.transform='perspective(700px) rotateX('+(o.fx*a+o.rx)+'deg) rotateY('+(o.fy*a+o.ry)+'deg) scale('+(kc*(1+b2))+','+(kc*(1-b2*.8))+')';
 o.dim.style.opacity=(1-d)*.4*a;const z=e>.01||o.on?100:10+Math.round(d*20);if(o.z!==z){o.z=z;st.zIndex=z}if(o.lh!==e){o.lh=e;st.setProperty('--hv',e)}const q=Math.round(d*25)/25;if(o.q!==q){o.q=q;st.setProperty('--sh','0 '+(10+34*q|0)+'px '+(16+34*q|0)+'px -12px rgba(0,0,0,'+(.5+.4*q).toFixed(2)+')')}}
 requestAnimationFrame(frame)
}
requestAnimationFrame(frame);
function paint(d){
 const c=d.card,q=s=>c.querySelector(s),up=d.p>=d.o;c.classList.toggle('dn',!up);
 if(!d.ready||!Number.isFinite(d.p)||d.p<=0){q('.price').textContent='加载中';q('.pct').textContent='--';return}
 q('.price').textContent=fmt(d.p);q('.pct').textContent=(up?'+':'')+((d.p/d.o-1)*100).toFixed(2)+'%';
 const vals=d.candles.map(v=>v.close).filter(v=>Number.isFinite(v)&&v>0);
 if(vals.length>1){const mn=Math.min(...vals),mx=Math.max(...vals),range=mx-mn||1,ln='M'+vals.map((v,k)=>(k*100/(vals.length-1)).toFixed(1)+' '+(23-(v-mn)/range*20).toFixed(1)).join('L');q('.ln').setAttribute('d',ln);q('.ar').setAttribute('d',ln+'L100 26L0 26Z')}
}
const API='https://api.bitget.com',CANDLE_REFRESH_MS=5*60*1000;
async function bitgetJson(path){const r=await fetch(API+path,{cache:'no-store'});if(!r.ok)throw new Error('Bitget HTTP '+r.status);const p=await r.json();if(p.code!=='00000'||!Array.isArray(p.data))throw new Error(p.msg||'Bitget response invalid');return p.data}
async function loadSparkline(d,symbol,isStock){
 try{const params=isStock?new URLSearchParams({category:'SPOT',symbol,interval:'1H',limit:'40'}):new URLSearchParams({symbol,productType:'USDT-FUTURES',granularity:'1H',limit:'40'}),path=isStock?'/api/v3/market/candles':'/api/v2/mix/market/candles',rows=await bitgetJson(path+'?'+params);
 d.candles=rows.filter(r=>Array.isArray(r)&&Number(r[1])>0&&Number(r[2])>0&&Number(r[3])>0&&Number(r[4])>0).sort((a,b)=>Number(a[0])-Number(b[0])).slice(-40).map(r=>({open:Number(r[1]),high:Number(r[2]),low:Number(r[3]),close:Number(r[4])}));d.candleUpdatedAt=Date.now();
 }catch(error){if(!d.candles.length)d.candles=[];d.candleUpdatedAt=Date.now()-CANDLE_REFRESH_MS+60000;console.warn('[Vegas Octopus] 1H candles failed for '+d.s+':',error)}paint(d)
}
let marketLoadInFlight=false;
async function loadMarketData(){
 if(marketLoadInFlight)return;marketLoadInFlight=true;
 try{
 const results=await Promise.allSettled([bitgetJson('/api/v2/mix/market/tickers?productType=USDT-FUTURES'),bitgetJson('/api/v3/market/tickers?category=SPOT'),bitgetJson('/api/v3/reality/market/stock-info')]);
 const [futureResult,spotResult,stockResult]=results,futures=futureResult.status==='fulfilled'?new Map(futureResult.value.map(t=>[String(t.symbol).toUpperCase(),t])):null,spots=spotResult.status==='fulfilled'?new Map(spotResult.value.map(t=>[String(t.symbol).toUpperCase(),t])):null;
 const realitySymbols=stockResult.status==='fulfilled'?new Map(stockResult.value.filter(s=>s&&s.code&&s.symbol).map(s=>[String(s.code).toUpperCase(),String(s.symbol)])):null;
 if(realitySymbols){const sk=stockResult.value.find(s=>s&&s.symbol&&(String(s.code||'').toUpperCase().replace(/[^A-Z0-9]/g,'')==='SKHY'||/SK\s*HYNIX/i.test(String(s.name||''))||/RSKHYUSDT/i.test(String(s.symbol||''))));if(sk)realitySymbols.set('SKHYNIX',String(sk.symbol))}
 const jobs=[];
 for(const d of C){
  if(REALITY_STOCKS.has(d.s)){
   if(!spots||!realitySymbols){if(!d.ready)d.card.querySelector('.price').textContent='行情暂不可用';continue}
   const symbol=realitySymbols.get(d.s),ticker=symbol&&spots.get(symbol.toUpperCase());if(!ticker){if(!d.ready)d.card.querySelector('.price').textContent='暂无行情';continue}
   const last=Number(ticker.lastPrice),open=Number(ticker.openPrice24h);if(!(last>0&&open>0)){if(!d.ready)d.card.querySelector('.price').textContent='数据无效';continue}
   d.api=symbol;d.p=last;d.o=open;d.ready=true;paint(d);if(Date.now()-d.candleUpdatedAt>=CANDLE_REFRESH_MS)jobs.push(()=>loadSparkline(d,symbol,true));
  }else{
   if(!futures){if(!d.ready)d.card.querySelector('.price').textContent='行情暂不可用';continue}
   const ticker=futures.get(d.api.toUpperCase());if(!ticker){if(!d.ready)d.card.querySelector('.price').textContent='暂无行情';continue}
   const last=Number(ticker.lastPr),open=Number(ticker.open24h);if(!(last>0&&open>0)){if(!d.ready)d.card.querySelector('.price').textContent='数据无效';continue}
   d.p=last;d.o=open;d.ready=true;paint(d);if(Date.now()-d.candleUpdatedAt>=CANDLE_REFRESH_MS)jobs.push(()=>loadSparkline(d,d.api,false));
  }
 }
 for(let i=0;i<jobs.length;i+=8)await Promise.allSettled(jobs.slice(i,i+8).map(job=>job()));
 }catch(error){console.warn('[Vegas Octopus] market feed failed:',error)}finally{marketLoadInFlight=false}
}
C.forEach(o=>{let timer;const off=e=>{clearTimeout(timer);timer=setTimeout(()=>{o.on=false;o.hx=o.hy=0},e.pointerType==='touch'?1500:80)};
 o.pos.addEventListener('pointerenter',()=>{clearTimeout(timer);o.on=true});
 o.pos.addEventListener('pointerleave',off);o.pos.addEventListener('pointercancel',off);
 o.pos.addEventListener('pointermove',e=>{const r=o.card.getBoundingClientRect(),x=(e.clientX-r.left)/r.width,y=(e.clientY-r.top)/r.height;o.hy=(x-.5)*14;o.hx=(.5-y)*16;o.card.style.setProperty('--mx',x*100+'%');o.card.style.setProperty('--my',y*100+'%')})
});
loadMarketData();window.setInterval(loadMarketData,15000);
})();</script>
