<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#02040a">
<title>Vegas 章鱼 · AETHER 3D 数据宇宙</title>
<style>
:root{color-scheme:dark;--text:#e8f5ff;--cyan:#31d9ff}
*{box-sizing:border-box;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#02040a;color:var(--text);font:13px/1.45 Inter,-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
body{position:fixed;inset:0;background:#02040a}
/* 第一层：全页面统一深邃黑暗背景；后续模块不得另建底色层。 */
body::before{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;background:#02040a}
/* 页面容器透明，所有内容叠加在第一层背景之上。 */
.app{position:relative;z-index:1;width:100%;height:100dvh;min-height:0;padding:0;background:transparent;overflow:hidden}
/* 第二层：最新事件悬浮模块。 */
.topbar{position:absolute;z-index:3;top:clamp(12px,2.2vh,28px);right:clamp(12px,2.2vw,32px);width:clamp(150px,22vw,320px);min-width:0;max-height:calc(100dvh - 24px);overflow:hidden;pointer-events:none}
.event-top-card{width:100%;min-width:0;min-height:0;max-height:100%;padding:0;display:flex;flex-direction:column;background:transparent!important;border:0!important;border-radius:0!important;box-shadow:none!important;pointer-events:auto}
.panel-head{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:0 0 7px}
.panel-title{display:flex;align-items:center;gap:7px;font-size:clamp(11px,.8vw,15px);font-weight:750;letter-spacing:.03em}
.panel-title .icon{display:inline-grid;place-items:center;width:clamp(20px,1.45vw,27px);height:clamp(20px,1.45vw,27px);border-radius:7px;background:rgba(35,200,255,.12);border:1px solid rgba(51,206,255,.3);color:var(--cyan)}

.v9-notification{display:flex;flex-direction:column;gap:clamp(8px,1.4vh,20px);flex:1;min-width:0;min-height:0;max-height:calc(100dvh - 76px);overflow:auto;overscroll-behavior:contain}
.v9-group{min-width:0;border-left:1px solid rgba(85,155,214,.18);padding-left:9px}
.v9-group-title{font-size:clamp(9px,.65vw,11px);font-weight:750;color:#a9d9ff;white-space:nowrap;margin-bottom:5px}
.v9-symbols{display:flex;flex-wrap:wrap;align-content:flex-start;gap:4px 7px;min-width:0}
.v9-symbol{font-size:clamp(8px,.62vw,10px);color:#8fe9ff;white-space:nowrap;text-shadow:0 0 8px rgba(49,217,255,.14)}
.v9-nochange{font-size:clamp(8px,.62vw,10px);color:#8ba4be;white-space:nowrap}
/* 第二层：发光球模块；背景透明，不覆盖第一层。 */
.main-grid{position:absolute;z-index:2;inset:0;min-width:0;min-height:0;display:grid;grid-template-columns:minmax(0,1fr);overflow:hidden;background:transparent;pointer-events:none}
.center-stage{position:relative;isolation:isolate;min-width:0;min-height:0;width:100%;height:100%;overflow:hidden;border-radius:0;background:transparent;pointer-events:none}
#orb-core-canvas{position:absolute;inset:0;width:100%;height:100%;display:block;z-index:1;pointer-events:auto;touch-action:pan-y;cursor:grab}
#orb-core-canvas:active{cursor:grabbing}
@media(max-width:600px){.topbar{top:12px;right:12px;width:clamp(132px,42vw,250px);max-height:calc(100dvh - 24px)}.v9-notification{gap:10px;max-height:calc(100dvh - 64px)}.v9-group{padding-left:6px}.panel-head{padding-bottom:5px}.v9-symbols{gap:4px 5px}}

/* 第三层：小卡片行情模块，独立叠加，不改动第一、二层。 */
#market-cards-layer{--up:#2ee6a6;--dn:#ff5c7c;--mute:#7f8db0;--ink:#e8f0ff;position:absolute;z-index:2;inset:0;min-width:0;min-height:0;pointer-events:none;overflow:hidden}
#market-cards-layer .mc-columns{position:absolute;top:clamp(66px,10vh,110px);right:auto;bottom:clamp(12px,2vh,28px);left:0;width:36%;height:auto;max-height:none;min-width:0;min-height:0;box-sizing:border-box;overflow:visible;pointer-events:auto;background:transparent!important;border:0!important;box-shadow:none!important;backdrop-filter:none!important;-webkit-backdrop-filter:none!important}
#market-cards-layer .mc-columns::after{content:"";position:absolute;inset:0;z-index:3;pointer-events:none;background:linear-gradient(to bottom,#02040a 0%,rgba(2,4,10,.72) 3%,rgba(2,4,10,0) 17%,rgba(2,4,10,0) 83%,rgba(2,4,10,.72) 97%,#02040a 100%),linear-gradient(to right,#02040a 0%,rgba(2,4,10,.72) 3%,rgba(2,4,10,0) 18%,rgba(2,4,10,0) 82%,rgba(2,4,10,.72) 97%,#02040a 100%);}
#market-cards-layer .mc-side{position:relative;z-index:1;display:flex;flex-direction:column;justify-content:flex-start;align-items:center;gap:clamp(8px,1.2vh,16px);min-width:0;min-height:0;width:100%;height:100%;max-height:100%;box-sizing:border-box;overflow-x:hidden;overflow-y:auto;overscroll-behavior:contain;padding-block:28px;scrollbar-width:none;-ms-overflow-style:none;pointer-events:auto;cursor:default;background:transparent!important;border:0!important;box-shadow:none!important;backdrop-filter:none!important;-webkit-backdrop-filter:none!important}#market-cards-layer .mc-side::-webkit-scrollbar{display:none;width:0;height:0}
#market-cards-layer .mc-slot{position:relative;flex:0 0 auto;perspective:900px;width:min(100%,clamp(126px,18vw,238px));min-width:0;max-width:100%;box-sizing:border-box;padding:5px 4px 16px;pointer-events:auto;opacity:var(--mc-page-opacity,1);filter:blur(var(--mc-page-blur,0px));transition:transform .12s linear,opacity .28s ease,filter .28s ease;transform:scale(var(--mc-focus-scale,1));transform-origin:center center;will-change:transform}
#market-cards-layer .mc-float{transform-style:preserve-3d;animation:mc-bob 5.5s ease-in-out infinite alternate;animation-delay:var(--d)}
@keyframes mc-bob{0%{transform:translateY(0) rotateY(-5deg) rotateX(2deg)}100%{transform:translateY(-7px) rotateY(5deg) rotateX(-2deg)}}
#market-cards-layer .mc-gshadow{position:absolute;left:14%;right:14%;bottom:0;height:14px;border-radius:50%;background:radial-gradient(closest-side,rgba(0,0,0,.65),transparent);filter:blur(5px);animation:mc-sh 5.5s ease-in-out infinite alternate;animation-delay:var(--d)}
@keyframes mc-sh{0%{transform:scale(1);opacity:.9}100%{transform:scale(.82);opacity:.5}}
#market-cards-layer .mc-card{--mc-c:var(--up);position:relative;transform-style:preserve-3d;transform:rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));transition:transform .14s ease-out;border-radius:17px;padding:clamp(10px,1.1vw,15px);min-height:clamp(122px,17vh,172px);touch-action:pan-y;cursor:default}
#market-cards-layer .mc-card.up{--mc-c:var(--up)}
#market-cards-layer .mc-card.dn{--mc-c:var(--dn)}
#market-cards-layer .mc-bg{position:absolute;inset:0;border-radius:inherit;background:linear-gradient(145deg,rgba(255,255,255,.13),rgba(255,255,255,.03));border:1px solid rgba(255,255,255,.2);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:0 18px 35px -22px rgba(0,0,0,.8)}
#market-cards-layer .mc-gl{position:absolute;inset:0;border-radius:inherit;pointer-events:none;opacity:0;transform:translateZ(50px);background:radial-gradient(circle at var(--mx,50%) var(--my,50%),rgba(255,255,255,.24),transparent 55%);transition:opacity .2s}
#market-cards-layer .mc-card.hot .mc-gl{opacity:1}
#market-cards-layer .mc-l1,#market-cards-layer .mc-l2,#market-cards-layer .mc-l3,#market-cards-layer .mc-l4{position:relative}
#market-cards-layer .mc-l1{transform:translateZ(14px)}
#market-cards-layer .mc-l2{transform:translateZ(22px)}
#market-cards-layer .mc-l3{transform:translateZ(28px)}
#market-cards-layer .mc-l4{transform:translateZ(34px)}
#market-cards-layer .mc-row{display:flex;align-items:center;gap:8px;min-width:0}
#market-cards-layer .mc-coin{flex:0 0 27px;width:27px;height:27px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:12px;color:#07101f;background:var(--mc-c);box-shadow:0 0 13px -2px var(--mc-c)}
#market-cards-layer .mc-sym{font-size:clamp(12px,1vw,15px);font-weight:700;white-space:nowrap}
#market-cards-layer .mc-sym small{font-size:10px;color:var(--mute);font-weight:500;margin-left:4px}
#market-cards-layer .mc-price{font-size:clamp(19px,1.8vw,27px);font-weight:700;margin:9px 0 4px;font-variant-numeric:tabular-nums;transition:color .3s;white-space:nowrap}
#market-cards-layer .mc-price.flash{color:var(--mc-c)}
#market-cards-layer .mc-pct{display:inline-block;padding:2px 8px;border-radius:99px;font-size:11px;font-weight:700;color:#07101f;background:var(--mc-c)}
#market-cards-layer .mc-spark{display:block;width:100%;height:28px;margin-top:7px}
#market-cards-layer .mc-spark .mc-ln{fill:none;stroke:var(--mc-c);stroke-width:2;vector-effect:non-scaling-stroke}
#market-cards-layer .mc-spark .mc-ar{fill:var(--mc-c);opacity:.14}
#market-cards-layer .mc-hl{margin-top:5px;font-size:10px;color:var(--mute);font-variant-numeric:tabular-nums;white-space:nowrap}
#market-cards-layer .mc-hl span{color:var(--ink);margin:0 5px 0 2px}
@media(max-width:700px){#market-cards-layer .mc-columns{top:clamp(76px,12vh,112px);bottom:8px}#market-cards-layer .mc-side{gap:10px}#market-cards-layer .mc-slot{width:min(100%,clamp(126px,43vw,190px));padding:3px 2px 12px}#market-cards-layer .mc-card{padding:9px;border-radius:14px;min-height:clamp(112px,15vh,145px)}#market-cards-layer .mc-sym small{font-size:9px}#market-cards-layer .mc-price{font-size:clamp(17px,4.4vw,23px)}#market-cards-layer .mc-hl{font-size:9px}}
@media(prefers-reduced-motion:reduce){#market-cards-layer .mc-float,#market-cards-layer .mc-gshadow{animation:none}}

</style>

function hrgb(h){h/=360;var q=.62+1-.62,p2=2*.62-q;function f(t){t=((t%1)+1)%1;return t<1/6?p2+(q-p2)*6*t:t<.5?q:t<2/3?p2+(q-p2)*(2/3-t)*6:p2}return[f(h+1/3)*255,f(h)*255,f(h-1/3)*255]}

var PAL=[0,28,52,150,190,245,320,280,170],PR=PAL.map(hrgb),N=900,P=[];
for(i=0;i<N;i++){var y=1-2*(i+.5)/N,r=Math.sqrt(1-y*y),th=i*2.399963;P.push({x:r*Math.cos(th),y:y,z:r*Math.sin(th),k:R(),c:Math.floor(R()*PAL.length),m:R()<.2?0:.5+R()*.4})}
function pj(v,cs,sn,cp,spp,cx,cy,Rr){var x1=v[0]*cs+v[2]*sn,z1=-v[0]*sn+v[2]*cs,y2=v[1]*cp-z1*spp,z2=v[1]*spp+z1*cp,f=1+z2*.12;return[cx+x1*Rr*f,cy+y2*Rr*f,z2]}

cv.addEventListener("pointerdown",function(e){dn=true;lx=e.clientX;ly=e.clientY;try{cv.setPointerCapture(e.pointerId)}catch(_){} });

cv.addEventListener("pointermove",function(e){if(!dn)return;rot+=(e.clientX-lx)*.008;pitB=Math.max(-1.2,Math.min(1.2,pitB+(e.clientY-ly)*.006));lx=e.clientX;ly=e.clientY});
var last=0,orbFrame=0;
function frame(ms){var t=ms/1000,dt=Math.max(0,Math.min(.05,t-last));last=t;if(!dn)rot+=dt*V.spd;
var cx=W*.66,cy=H*.5,roomX=Math.min(cx-8,W-cx-8),roomY=Math.max(1,H*.46),Rr=Math.max(1,Math.min(roomX,roomY)*V.zm),pit=pitB+.1*Math.sin(t*.17),cp=Math.cos(pit),spp=Math.sin(pit);

<script>
/* 第二层：最新事件模块，读取正式信号状态。 */
(function(){
  const STATE_URL="https://raw.githubusercontent.com/MraJJqq/vegas-octopus-v2/main/v9-signals.json";
  const CORE_ORDER=["BTC","HYPE","XAU","CL"];
  const STOCK_ORDER=["AAPL","MSFT","GOOGL","AMZN","NVDA","TSLA","META","INTC","QCOM","AMD","TSM","AVGO","ORCL","ARM","MU","ASML","SNDK","SKHYNIX","MRVL","GLW","HOOD","CBRS","SPCX"];
  const ALLOWED=new Set(CORE_ORDER.concat(STOCK_ORDER));
  const $=id=>document.getElementById(id);
  function symbolName(raw){
    let s=String(raw||"").trim().toUpperCase();
    if(s.endsWith("USDT"))s=s.slice(0,-4);
    if(s==="CLU")s="CL";
    return s;
  }
  function todayBeijing(){
    const parts=new Intl.DateTimeFormat("en-CA",{timeZone:"Asia/Shanghai",year:"numeric",month:"2-digit",day:"2-digit"}).formatToParts(new Date());
    const p={};parts.forEach(x=>{p[x.type]=x.value});
    return p.year+"-"+p.month+"-"+p.day;
  }
  function renderSymbols(targetId,symbols){
    const target=$(targetId);
    if(!target)return;
    target.replaceChildren();
    if(!symbols.length){
      const empty=document.createElement("span");
      empty.className="v9-nochange";
      empty.textContent="▰ No change ▰";
      target.appendChild(empty);
      return;
    }
    symbols.forEach(symbol=>{
      const item=document.createElement("span");
      item.className="v9-symbol";
      item.textContent="▰ "+symbol+" ▰";
      target.appendChild(item);
    });
  }
  function renderMessage(message){
    ["v9Stocks","v9Core"].forEach(id=>{
      const target=$(id);
      if(!target)return;
      target.replaceChildren();
      const item=document.createElement("span");
      item.className="v9-nochange";
      item.textContent=message;
      target.appendChild(item);
    });
  }
  async function fetchStateJson(){
    const response=await fetch(STATE_URL+"?t="+Date.now(),{cache:"no-store"});
    if(!response.ok)throw new Error("公开信号镜像 HTTP "+response.status);
    return await response.json();
  }
  async function refreshV9State(){
    try{
      const state=await fetchStateJson();
      const daily=state&&state.__daily_formal_signals__;
      if(!daily||!Array.isArray(daily.signals))throw new Error("状态格式无效");
      if(daily.date!==todayBeijing()){
        renderMessage("等待今日扫描");
        return;
      }
      const seen=new Set();
      for(const signal of daily.signals){
        if(!signal||signal.formal_signal!==true)continue;
        const s=symbolName(signal.symbol);
        if(ALLOWED.has(s))seen.add(s);
      }
      renderSymbols("v9Stocks",STOCK_ORDER.filter(s=>seen.has(s)));
      renderSymbols("v9Core",CORE_ORDER.filter(s=>seen.has(s)));
    }catch(error){
      const detail=String(error&&error.message||error).slice(0,70);
      renderMessage("读取失败："+detail);
      console.warn("V9 latest-events state unavailable:",error);
    }
  }
  refreshV9State();
  window.setInterval(refreshV9State,15*60*1000);
})();
</script>

];
const REALITY_STOCKS=new Set(P.slice(0,23).map(x=>x[0]));
const fmt=p=>p>=1000?p.toLocaleString('en-US',{maximumFractionDigits:1}):p>=100?p.toFixed(2):p>=1?p.toFixed(3):p>=.01?p.toFixed(4):p.toFixed(6);
const S=P.map(([s,api],i)=>({s,api,i,p:0,o:0,h:[],ready:false}));
const left=document.getElementById('mc-left');
S.forEach(d=>{
 left.insertAdjacentHTML('beforeend',`<div class="mc-slot"><div class="mc-float" style="--d:${-d.i*.9}s"><div class="mc-card" id="mc-c${d.i}"><div class="mc-bg"></div><i class="mc-gl"></i><div class="mc-row mc-l2"><span class="mc-coin">${d.s[0]}</span><b class="mc-sym">${d.s}<small>/USDT 永续</small></b></div><div class="mc-price mc-l4">加载中</div><div class="mc-l3"><span class="mc-pct">--</span></div><svg class="mc-spark mc-l1" viewBox="0 0 200 35" preserveAspectRatio="none"><path class="mc-ar"/><path class="mc-ln"/></svg><div class="mc-hl mc-l2">高<span class="mc-hi">--</span>低<span class="mc-lo">--</span></div></div></div><div class="mc-gshadow" style="--d:${-d.i*.9}s"></div></div>`);
});
function paint(d){
 const c=document.getElementById('mc-c'+d.i),q=s=>c.querySelector(s);
 if(!d.ready||!Number.isFinite(d.p)||d.p<=0){q('.mc-price').textContent='加载中';q('.mc-pct').textContent='--';q('.mc-hi').textContent='--';q('.mc-lo').textContent='--';q('.mc-ln').setAttribute('d','');q('.mc-ar').setAttribute('d','');return}
 const up=d.p>=d.o;c.classList.toggle('up',up);c.classList.toggle('dn',!up);
 q('.mc-price').textContent=fmt(d.p);q('.mc-pct').textContent=(up?'+':'')+((d.p/d.o-1)*100).toFixed(2)+'%';
 const values=d.h.filter(v=>Number.isFinite(v)&&v>0);
 if(values.length>1){const mn=Math.min(...values),mx=Math.max(...values),r=mx-mn||1;const pts=values.map((v,k)=>[k*200/(values.length-1),32-(v-mn)/r*28]);const ln='M'+pts.map(p=>p[0].toFixed(1)+' '+p[1].toFixed(1)).join('L');q('.mc-ln').setAttribute('d',ln);q('.mc-ar').setAttribute('d',ln+'L200 35L0 35Z');q('.mc-hi').textContent=fmt(mx);q('.mc-lo').textContent=fmt(mn)}
}
let focusSlots=Array.from(left.querySelectorAll('.mc-slot'));
let focusFrame=0;
function updateFocusScale(){
 focusFrame=0;
 const view=left.getBoundingClientRect(),center=view.top+view.height/2,range=Math.max(1,view.height*.52),fadeRange=Math.max(1,view.height*.46),available=Math.max(1,left.clientWidth-8);
 const metrics=focusSlots.map(slot=>{
  const r=slot.getBoundingClientRect(),distance=Math.abs((r.top+r.height/2)-center),t=Math.min(1,distance/range),ease=t*t*(3-2*t),fadeT=Math.min(1,distance/fadeRange),fadeEase=fadeT*fadeT*(3-2*fadeT);
  const visible=Math.max(0,Math.min(r.bottom,view.bottom)-Math.max(r.top,view.top)),ratio=Math.min(1,visible/Math.max(1,r.height)),focused=distance<view.height*.23&&ratio>=.98;
  return {slot,scale:1+(Math.min(1.34,available/Math.max(1,slot.offsetWidth))-1)*(1-ease),opacity:focused?1:(1-.72*fadeEase)*Math.min(1,ratio*1.8),blur:focused?0:2.8*fadeEase+(1-ratio)*1.2};
 });
 metrics.forEach(({slot,scale,opacity,blur})=>{
  slot.style.setProperty('--mc-focus-scale',scale.toFixed(3));
  slot.style.setProperty('--mc-page-opacity',Math.max(.025,opacity).toFixed(3));
  slot.style.setProperty('--mc-page-blur',Math.max(0,blur).toFixed(2)+'px');
 });
}
function queueFocusScale(){if(!focusFrame)focusFrame=requestAnimationFrame(updateFocusScale)}
let wheelTarget=left.scrollTop,wheelFrame=0,wheelVelocity=0,wheelLastTime=0,loopBusy=false,loopDirection=1;
function cardStep(){
 const first=left.firstElementChild;
 return first?first.getBoundingClientRect().height+(parseFloat(getComputedStyle(left).rowGap)||0):0;
}
function normalizeLoopPosition(){
 if(loopBusy||focusSlots.length<2)return;
 const step=cardStep();
 if(step<1)return;
 loopBusy=true;
 let top=left.scrollTop,guard=0;
 const count=focusSlots.length;
 if(loopDirection<0){
  while(top<=0&&guard++<count){
   const last=focusSlots.pop();
   left.insertBefore(last,left.firstElementChild);
   focusSlots.unshift(last);
   top+=step;
   wheelTarget+=step;
  }
 }else{
  while(top>=step&&guard++<count){
   const first=focusSlots.shift();
   left.appendChild(first);
   focusSlots.push(first);
   top-=step;
   wheelTarget-=step;
  }
 }
 if(Math.abs(top-left.scrollTop)>.1)left.scrollTop=top;
 loopBusy=false;
}
function smoothWheelStep(now){
 if(!wheelLastTime)wheelLastTime=now;
 const dt=Math.min(32,Math.max(1,now-wheelLastTime));
 wheelLastTime=now;
 const current=left.scrollTop,diff=wheelTarget-current;
 left.scrollTop=current+diff*(1-Math.exp(-dt/55));
 normalizeLoopPosition();
 wheelVelocity*=Math.exp(-dt/260);
 if(Math.abs(wheelVelocity)>.01)wheelTarget+=wheelVelocity*dt;
 else wheelVelocity=0;
 queueFocusScale();
 if(Math.abs(wheelTarget-left.scrollTop)<.6&&Math.abs(wheelVelocity)<.01){
  wheelTarget=left.scrollTop;wheelFrame=0;wheelLastTime=0;return;
 }
 wheelFrame=requestAnimationFrame(smoothWheelStep);
}
left.addEventListener('wheel',e=>{
 if(Math.abs(e.deltaY)<.1)return;
 e.preventDefault();
 const unit=e.deltaMode===1?16:e.deltaMode===2?left.clientHeight:1;
 const delta=e.deltaY*unit;
 loopDirection=delta<0?-1:1;
 if(!wheelFrame)wheelTarget=left.scrollTop;
 wheelTarget+=delta*1.05;
 wheelVelocity=Math.max(-1.2,Math.min(1.2,wheelVelocity+delta*.016));
 if(!wheelFrame)wheelFrame=requestAnimationFrame(smoothWheelStep);
},{passive:false});
left.addEventListener('scroll',()=>{
 if(!wheelFrame){wheelTarget=left.scrollTop;wheelVelocity=0}
 queueFocusScale();
},{passive:true});
left.addEventListener('touchstart',()=>{wheelVelocity=0;wheelTarget=left.scrollTop},{passive:true});
left.addEventListener('touchend',()=>{wheelTarget=left.scrollTop;wheelVelocity=0},{passive:true});
window.addEventListener('resize',queueFocusScale,{passive:true});
left.style.scrollBehavior='auto';
queueFocusScale();
const API='https://api.bitget.com';
async function bitgetJson(path){const r=await fetch(API+path,{cache:'no-store'});if(!r.ok)throw new Error('Bitget HTTP '+r.status);const p=await r.json();if(p.code!=='00000'||!Array.isArray(p.data))throw new Error(p.msg||'Bitget response invalid');return p.data}
async function loadSparkline(d,symbol,isStock){
 try{const params=isStock?new URLSearchParams({category:'SPOT',symbol,interval:'1H',limit:'40'}):new URLSearchParams({symbol,productType:'USDT-FUTURES',granularity:'1H',limit:'40'});const path=isStock?'/api/v3/market/candles':'/api/v2/mix/market/candles';const rows=await bitgetJson(path+'?'+params);d.h=rows.filter(r=>Array.isArray(r)&&Number(r[4])>0).sort((a,b)=>Number(a[0])-Number(b[0])).map(r=>Number(r[4])).slice(-40)}catch(error){d.h=[];console.warn('[Vegas Octopus] 1H candles failed for '+d.s+':',error)}paint(d)
}
let marketLoadInFlight=false;
async function loadMarketData(){
 if(marketLoadInFlight)return;marketLoadInFlight=true;
 try{
  const results=await Promise.allSettled([bitgetJson('/api/v2/mix/market/tickers?productType=USDT-FUTURES'),bitgetJson('/api/v3/market/tickers?category=SPOT'),bitgetJson('/api/v3/reality/market/stock-info')]);
  const [futureResult,spotResult,stockResult]=results;
  const futures=futureResult.status==='fulfilled'?new Map(futureResult.value.map(t=>[String(t.symbol).toUpperCase(),t])):null;
  const spots=spotResult.status==='fulfilled'?new Map(spotResult.value.map(t=>[String(t.symbol).toUpperCase(),t])):null;
  const realitySymbols=stockResult.status==='fulfilled'?new Map(stockResult.value.filter(s=>s&&s.code&&s.symbol).map(s=>[String(s.code).toUpperCase(),String(s.symbol)])):null;
  if(realitySymbols&&stockResult.status==='fulfilled'){const sk=stockResult.value.find(s=>s&&s.symbol&&(String(s.code||'').toUpperCase().replace(/[^A-Z0-9]/g,'')==='SKHY'||/SK\s*HYNIX/i.test(String(s.name||''))||/RSKHYUSDT/i.test(String(s.symbol||''))));if(sk)realitySymbols.set('SKHYNIX',String(sk.symbol))}
  const sparkJobs=[];
  S.forEach(d=>{
   if(REALITY_STOCKS.has(d.s)){
    if(!spots||!realitySymbols){if(!d.ready)document.querySelector('#mc-c'+d.i+' .mc-price').textContent='行情暂不可用';return}
    const symbol=realitySymbols.get(d.s),ticker=symbol&&spots.get(symbol.toUpperCase());
    if(!ticker){if(!d.ready)document.querySelector('#mc-c'+d.i+' .mc-price').textContent='暂无行情';return}
    const last=Number(ticker.lastPrice),open=Number(ticker.openPrice24h);
    if(!(last>0&&open>0)){if(!d.ready)document.querySelector('#mc-c'+d.i+' .mc-price').textContent='数据无效';return}
    d.api=symbol;d.p=last;d.o=open;d.ready=true;paint(d);sparkJobs.push(()=>loadSparkline(d,symbol,true));
   }else{
    if(!futures){if(!d.ready)document.querySelector('#mc-c'+d.i+' .mc-price').textContent='行情暂不可用';return}
    const ticker=futures.get(d.api.toUpperCase());
    if(!ticker){if(!d.ready)document.querySelector('#mc-c'+d.i+' .mc-price').textContent='暂无行情';return}
    const last=Number(ticker.lastPr),open=Number(ticker.open24h);
    if(!(last>0&&open>0)){if(!d.ready)document.querySelector('#mc-c'+d.i+' .mc-price').textContent='数据无效';return}
    d.p=last;d.o=open;d.ready=true;paint(d);sparkJobs.push(()=>loadSparkline(d,d.api,false));
   }
  });
  for(let i=0;i<sparkJobs.length;i+=8)await Promise.allSettled(sparkJobs.slice(i,i+8).map(job=>job()));
 }catch(error){console.warn('[Vegas Octopus] market feed failed:',error)}finally{marketLoadInFlight=false}
}
loadMarketData();setInterval(loadMarketData,15000);
document.querySelectorAll('#market-cards-layer .mc-slot').forEach(el=>{const c=el.querySelector('.mc-card');const off=()=>{c.style.setProperty('--rx','0deg');c.style.setProperty('--ry','0deg');c.classList.remove('hot')};el.addEventListener('pointermove',e=>{const r=el.getBoundingClientRect(),x=(e.clientX-r.left)/r.width,y=(e.clientY-r.top)/r.height;c.style.setProperty('--ry',((x-.5)*24)+'deg');c.style.setProperty('--rx',((.5-y)*20)+'deg');c.style.setProperty('--mx',x*100+'%');c.style.setProperty('--my',y*100+'%');c.classList.add('hot')});['pointerleave','pointerup','pointercancel'].forEach(t=>el.addEventListener(t,off))});
})();
</script>
