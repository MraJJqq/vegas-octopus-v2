<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#02040a">
<title>Vegas 章鱼</title>
<link rel="stylesheet" href="./assets/css/app.css?v=20261030-57">
<link rel="stylesheet" href="./assets/css/right-signal-scroll.css?v=20261030-12">
<link rel="stylesheet" href="./assets/css/bottom-signal-ticker.css?v=20261030-3">
</head>
<body>
<div class="app">
<div id="v9-signal-source" hidden aria-hidden="true">
<div id="v9Stocks"></div><div id="v9Core"></div>
</div>
<section id="market-cards-layer" aria-label="27个品种实时行情卡片">
  <div class="mc-columns">
    <div class="mc-side left" id="mc-left" aria-label="全部27个行情卡片，纵向滚动"></div>
  </div>
</section>

</div>
<section id="vegas-right-scroll" aria-label="正式信号K线纵向滚动区域" hidden>
 <div class="vr-single">
  <header class="vr-head"><strong class="vr-symbol"></strong><span class="vr-status">等待正式信号…</span><nav class="vr-periods" aria-label="K线周期"></nav></header>
  <div class="vr-error" hidden></div>
 </div>
</section>
<div id="vegas-signal-ticker" aria-label="正式信号底部横向滚动播报"><div class="vst-track"><span class="vst-empty">等待正式信号</span></div></div>
<script src="./assets/js/v9-events.js?v=20261030-4"></script>
<script src="./assets/js/market-cards.js?v=20261030-18"></script>
<script>
(function(){
 const sources=[
  'https://cdn.jsdelivr.net/npm/lightweight-charts@5.2.1/dist/lightweight-charts.standalone.production.js',
  'https://unpkg.com/lightweight-charts@5.2.1/dist/lightweight-charts.standalone.production.js'
 ];
 function loadSource(index){
  if(index>=sources.length){console.error('[Vegas Right Scroll] chart library failed to load');return;}
  const script=document.createElement('script');script.src=sources[index];
  script.onload=function(){const app=document.createElement('script');app.src='./assets/js/right-signal-scroll.js?v=20261030-21';app.onerror=function(){console.error('[Vegas Right Scroll] K-line module failed to load');};document.body.appendChild(app);};
  script.onerror=function(){script.remove();loadSource(index+1);};document.head.appendChild(script);
 }
 loadSource(0);
})();
</script>
<script src="./assets/js/bottom-signal-ticker.js?v=20261030-4"></script>
</body>
</html>
