<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#02040a">
<title>Vegas 章鱼</title>
<link rel="stylesheet" href="./assets/css/app.css?v=20261030-54">
<link rel="stylesheet" href="./assets/css/right-signal-scroll.css?v=20261030-1">
</head>
<body>
<div class="app">
<header class="topbar">
<section class="event-top-card" aria-label="最新事件">
<div class="v9-notification" aria-live="polite">
<section class="v9-group"><div class="v9-group-title">美股信号</div><div class="v9-symbols" id="v9Stocks"><span class="v9-nochange">▰ No change ▰</span></div></section>
<section class="v9-group"><div class="v9-group-title">核心品种</div><div class="v9-symbols" id="v9Core"><span class="v9-nochange">▰ No change ▰</span></div></section>
</div></section></header>
<section id="market-cards-layer" aria-label="27个品种实时行情卡片">
  <div class="mc-columns">
    <div class="mc-side left" id="mc-left" aria-label="全部27个行情卡片，纵向滚动"></div>
  </div>
</section>
<section id="vegas-right-scroll" aria-label="正式信号K线滚动区域" hidden><div class="vr-list"></div></section>
</div>
<script src="./assets/js/v9-events.js?v=20261030-4"></script>
<script src="./assets/js/market-cards.js?v=20261030-18"></script>
<script>
/* 右滚动K线依赖异步加载；信号队列由右滚动模块直接接管。 */
(function(){
 const sources=[
  'https://cdn.jsdelivr.net/npm/lightweight-charts@5.2.1/dist/lightweight-charts.standalone.production.js',
  'https://unpkg.com/lightweight-charts@5.2.1/dist/lightweight-charts.standalone.production.js'
 ];
 function loadSource(index){
  if(index>=sources.length){
   console.error('[Vegas Right Scroll] chart library failed to load');
   return;
  }
  const script=document.createElement('script');
  script.src=sources[index];
  script.onload=function(){
   const app=document.createElement('script');
   app.src='./assets/js/right-signal-scroll.js?v=20261030-1';
   app.onerror=function(){console.error('[Vegas Right Scroll] K-line module failed to load');};
   document.body.appendChild(app);
  };
  script.onerror=function(){script.remove();loadSource(index+1);};
  document.head.appendChild(script);
 }
 loadSource(0);
})();
</script>


</body>
</html>
