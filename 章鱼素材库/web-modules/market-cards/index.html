<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>3D 悬浮行情卡片</title>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#070b18;--ink:#e8f0ff;--mute:#7f8db0;--up:#2ee6a6;--dn:#ff5c7c;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100vh;background:radial-gradient(1100px 700px at 50% -10%,#18275a 0,var(--bg) 62%) fixed;color:var(--ink);font-family:'Chakra Petch',ui-sans-serif,system-ui,-apple-system,'PingFang SC',sans-serif}
header{padding:28px 22px 6px;max-width:1100px;margin:0 auto}
h1{margin:0 0 6px;font-size:26px;font-weight:700;letter-spacing:.02em}
header p{margin:0 0 10px;color:var(--mute);font-size:14px}
#grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:10px;max-width:1100px;margin:0 auto;padding:18px 14px 60px}
.slot{position:relative;perspective:900px;padding:18px 16px 34px}
.float{transform-style:preserve-3d;animation:bob 5.5s ease-in-out infinite alternate;animation-delay:var(--d)}
@keyframes bob{0%{transform:translateY(0) rotateY(-5deg) rotateX(2deg)}100%{transform:translateY(-12px) rotateY(5deg) rotateX(-2deg)}}
.gshadow{position:absolute;left:14%;right:14%;bottom:8px;height:22px;border-radius:50%;background:radial-gradient(closest-side,rgba(0,0,0,.65),transparent);filter:blur(6px);animation:sh 5.5s ease-in-out infinite alternate;animation-delay:var(--d)}
@keyframes sh{0%{transform:scale(1);opacity:.9}100%{transform:scale(.82);opacity:.5}}
.card{--c:var(--up);position:relative;transform-style:preserve-3d;transform:rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));transition:transform .14s ease-out;border-radius:22px;padding:20px;min-height:200px;touch-action:pan-y;user-select:none;-webkit-user-select:none;cursor:default}
.card.up{--c:var(--up)}
.card.dn{--c:var(--dn)}
.bg{position:absolute;inset:0;border-radius:inherit;background:linear-gradient(145deg,rgba(255,255,255,.13),rgba(255,255,255,.03));border:1px solid rgba(255,255,255,.2);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:0 30px 50px -24px rgba(0,0,0,.8)}
.gl{position:absolute;inset:0;border-radius:inherit;pointer-events:none;opacity:0;transform:translateZ(80px);background:radial-gradient(circle at var(--mx,50%) var(--my,50%),rgba(255,255,255,.28),transparent 55%);transition:opacity .2s}
.card.hot .gl{opacity:1}
.l1,.l2,.l3,.l4{position:relative}
.l1{transform:translateZ(24px)}
.l2{transform:translateZ(46px)}
.l3{transform:translateZ(60px)}
.l4{transform:translateZ(78px)}
.row{display:flex;align-items:center;gap:10px}
.coin{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:15px;color:#07101f;background:var(--c);box-shadow:0 0 16px -2px var(--c)}
.sym{font-size:18px;font-weight:700}
.sym small{font-size:12px;color:var(--mute);font-weight:500;margin-left:6px}
.price{font-size:34px;font-weight:700;margin:14px 0 4px;font-variant-numeric:tabular-nums;transition:color .3s}
.price.flash{color:var(--c)}
.pct{display:inline-block;padding:3px 10px;border-radius:99px;font-size:14px;font-weight:700;color:#07101f;background:var(--c)}
.spark{display:block;width:100%;height:50px;margin-top:12px}
.spark .ln{fill:none;stroke:var(--c);stroke-width:2;vector-effect:non-scaling-stroke}
.spark .ar{fill:var(--c);opacity:.14}
.hl{margin-top:8px;font-size:12px;color:var(--mute);font-variant-numeric:tabular-nums}
.hl span{color:var(--ink);margin:0 12px 0 4px}
@media (prefers-reduced-motion:reduce){.float,.gshadow{animation:none}}
</style>
</head>
<body>
<header>
  <h1>行情悬浮卡</h1>
  <p>模拟报价，每秒跳动。鼠标划过或手指按住卡片可倾斜。</p>
</header>
<main id="grid"></main>
<script>
const P=[["BTC",67850,.0009],["ETH",2610,.0013],["SOL",172,.002],["BNB",585,.001],["XRP",.52,.0018],["DOGE",.158,.0025]];
const grid=document.getElementById('grid');
const fmt=p=>p>=100?p.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2}):p>=1?p.toFixed(3):p.toFixed(4);
const S=P.map(([s,p,v],i)=>{
  const h=[];let x=p*(1+(Math.random()-.5)*.01);
  for(let k=0;k<40;k++){x*=1+(Math.random()-.5)*2*v;h.push(x)}
  return {s,v,p:h[39],o:h[0],h,i};
});
grid.innerHTML=S.map(d=>`<div class="slot"><div class="float" style="--d:${-d.i*.9}s"><div class="card" id="c${d.i}">
<div class="bg"></div><i class="gl"></i>
<div class="row l2"><span class="coin">${d.s[0]}</span><b class="sym">${d.s}<small>/USDT 永续</small></b></div>
<div class="price l4"></div>
<div class="l3"><span class="pct"></span></div>
<svg class="spark l1" viewBox="0 0 200 50" preserveAspectRatio="none"><path class="ar"/><path class="ln"/></svg>
<div class="hl l2">高<span class="hi"></span>低<span class="lo"></span></div>
</div></div><div class="gshadow" style="--d:${-d.i*.9}s"></div></div>`).join('');
function paint(d){
  const c=document.getElementById('c'+d.i),q=s=>c.querySelector(s);
  const up=d.p>=d.o;c.classList.toggle('up',up);c.classList.toggle('dn',!up);
  q('.price').textContent=fmt(d.p);
  q('.pct').textContent=(up?'+':'')+((d.p/d.o-1)*100).toFixed(2)+'%';
  const mn=Math.min(...d.h),mx=Math.max(...d.h),r=mx-mn||1;
  const pts=d.h.map((v,k)=>[k*200/39,46-(v-mn)/r*42]);
  const ln='M'+pts.map(p=>p[0].toFixed(1)+' '+p[1].toFixed(1)).join('L');
  q('.ln').setAttribute('d',ln);q('.ar').setAttribute('d',ln+'L200 50L0 50Z');
  q('.hi').textContent=fmt(mx);q('.lo').textContent=fmt(mn);
}
S.forEach(paint);
setInterval(()=>{S.forEach(d=>{
  d.p*=1+(Math.random()-.5)*2*d.v;d.h.push(d.p);d.h.shift();paint(d);
  const pr=document.querySelector('#c'+d.i+' .price');pr.classList.add('flash');setTimeout(()=>pr.classList.remove('flash'),250);
})},1000);
document.querySelectorAll('.slot').forEach(el=>{
  const c=el.querySelector('.card');
  const off=()=>{c.style.setProperty('--rx','0deg');c.style.setProperty('--ry','0deg');c.classList.remove('hot')};
  el.addEventListener('pointermove',e=>{
    const r=el.getBoundingClientRect(),x=(e.clientX-r.left)/r.width,y=(e.clientY-r.top)/r.height;
    c.style.setProperty('--ry',((x-.5)*34)+'deg');c.style.setProperty('--rx',((.5-y)*28)+'deg');
    c.style.setProperty('--mx',x*100+'%');c.style.setProperty('--my',y*100+'%');c.classList.add('hot');
  });
  ['pointerleave','pointerup','pointercancel'].forEach(t=>el.addEventListener(t,off));
});
</script>
</body>
</html>
