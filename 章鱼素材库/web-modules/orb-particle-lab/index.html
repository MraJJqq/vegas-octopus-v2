<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>粒子球 · 发光体实验室 v3</title>
<style>
:root{--bg:#02050c;--cy:#3fc8ff;--am:#f2b72a;--tx:#aecbe0;--dim:#4a6579;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
body{margin:0;height:100%;background:radial-gradient(circle at 50% 50%,rgba(245,184,46,.12),transparent 40%),var(--bg);color:var(--tx);font:12px/1.5 ui-monospace,Menlo,monospace;overflow:hidden;touch-action:none}
#c{position:fixed;inset:0;width:100%;height:100%}
.t{position:fixed;left:14px;top:calc(env(safe-area-inset-top,0px) + 12px);letter-spacing:.12em;color:#d9ecff;pointer-events:none}
.t small{display:block;color:var(--dim);font-size:10px}
#ui{position:fixed;left:10px;right:10px;bottom:calc(env(safe-area-inset-bottom,0px) + 10px);max-width:420px;border:1px solid #143650;background:rgba(4,10,22,.88);padding:8px 12px 10px}
#ui.min .r,#ui.min #ro{display:none}
#hd{display:flex;justify-content:space-between;color:var(--cy);letter-spacing:.1em;cursor:pointer}
.r{display:grid;grid-template-columns:88px 1fr 38px;align-items:center;gap:8px;margin-top:6px}
.r b{font-weight:400;text-align:right;color:var(--am)}
input[type=range]{width:100%;accent-color:#3fc8ff;margin:0}
#ro{margin-top:8px;color:var(--dim);font-size:10px;user-select:text;-webkit-user-select:text}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="t">粒子球 · ORB v3<small>拖动旋转 · 滑块调参</small></div>
<div id="ui"><div id="hd"><span>参数</span><span id="tg">收起 ▾</span></div>
<div class="r"><span>自转速度</span><input id="spd" type="range" min="0" max="1" step=".01" value=".2"><b></b></div>
<div class="r"><span>缩放</span><input id="zm" type="range" min=".6" max="1.6" step=".01" value="1"><b></b></div>
<div class="r"><span>球心连线</span><input id="ln" type="range" min="0" max="2.5" step=".05" value="1"><b></b></div>
<div class="r"><span>粒子大小</span><input id="ps" type="range" min=".5" max="2.2" step=".05" value="1.2"><b></b></div>
<div class="r"><span>数据流强度</span><input id="fl" type="range" min=".3" max="3" step=".05" value="1"><b></b></div>
<div id="ro"></div></div>
<script>
var R=Math.random,PI=Math.PI,cv=document.getElementById("c"),x=cv.getContext("2d"),W,H,i,j;
function $(i){return document.getElementById(i)}
function rs(){var d=window.devicePixelRatio||1;W=innerWidth;H=innerHeight;cv.width=W*d;cv.height=H*d;x.setTransform(d,0,0,d,0,0)}
rs();addEventListener("resize",rs);
var ids=["spd","zm","ln","ps","fl"],V={};
try{var sv=JSON.parse(localStorage.getItem("orbv3")||"{}");ids.forEach(function(k){if(sv[k]!=null)$(k).value=sv[k]})}catch(e){}$("ps").value="1.2";
function rd(){var o=[];ids.forEach(function(k){var e=$(k);V[k]=+e.value;e.parentNode.querySelector("b").textContent=(+e.value).toFixed(2);o.push(k+"="+(+e.value).toFixed(2))});$("ro").textContent="当前参数 "+o.join(" · ");try{localStorage.setItem("orbv3",JSON.stringify(V))}catch(e){}}
ids.forEach(function(k){$(k).addEventListener("input",rd)});rd();
$("hd").addEventListener("click",function(){var u=$("ui");u.classList.toggle("min");$("tg").textContent=u.classList.contains("min")?"展开 ▸":"收起 ▾"});
/* glow sprites */
var SG=[];
for(i=0;i<36;i++){(function(h){var c=document.createElement("canvas");c.width=c.height=64;var g=c.getContext("2d"),q=g.createRadialGradient(32,32,0,32,32,32);q.addColorStop(0,"hsla("+h+",100%,85%,1)");q.addColorStop(.25,"hsla("+h+",100%,62%,.5)");q.addColorStop(1,"hsla("+h+",100%,50%,0)");g.fillStyle=q;g.fillRect(0,0,64,64);SG.push(c)})(i*10)}
function blit(h,px,py,s,al){x.globalAlpha=Math.max(0,Math.min(1,al));x.drawImage(SG[((Math.round(h/10)%36)+36)%36],px-s,py-s,s*2,s*2)}
function hrgb(h){h/=360;var q=.62+1-.62,p2=2*.62-q;function f(t){t=((t%1)+1)%1;return t<1/6?p2+(q-p2)*6*t:t<.5?q:t<2/3?p2+(q-p2)*(2/3-t)*6:p2}return[f(h+1/3)*255,f(h)*255,f(h-1/3)*255]}
/* orb (v1 model): fibonacci sphere, multicolour end dots */
var PAL=[0,28,52,150,190,245,320,280,170],PR=PAL.map(hrgb),N=900,P=[],HT=new Float32Array(N).fill(-9),HH=new Float32Array(N);
for(i=0;i<N;i++){var y=1-2*(i+.5)/N,r=Math.sqrt(1-y*y),th=i*2.399963;P.push({x:r*Math.cos(th),y:y,z:r*Math.sin(th),k:R(),c:Math.floor(R()*PAL.length),m:R()<.2?0:.5+R()*.4})}
function pj(v,cs,sn,cp,spp,cx,cy,Rr){var x1=v[0]*cs+v[2]*sn,z1=-v[0]*sn+v[2]*cs,y2=v[1]*cp-z1*spp,z2=v[1]*spp+z1*cp,f=1+z2*.12;return[cx+x1*Rr*f,cy+y2*Rr*f,z2]}
/* seven coloured fibre streams (orb-lab v1 pulses) */
var SH=[0,28,52,150,190,245,320],F=[];
for(i=0;i<150;i++)F.push({s:i%7,t:Math.floor(R()*N),o:R(),v:.18+R()*.25});
function bz(a,b,c,s){var q=1-s;return[q*q*a[0]+2*q*s*b[0]+s*s*c[0],q*q*a[1]+2*q*s*b[1]+s*s*c[1]]}
/* drag */
var rot=0,pitB=.32,dn=false,lx=0,ly=0;
cv.addEventListener("pointerdown",function(e){dn=true;lx=e.clientX;ly=e.clientY});
addEventListener("pointerup",function(){dn=false});
addEventListener("pointermove",function(e){if(!dn)return;rot+=(e.clientX-lx)*.008;pitB=Math.max(-1.2,Math.min(1.2,pitB+(e.clientY-ly)*.006));lx=e.clientX;ly=e.clientY});
var last=0;
function frame(ms){var t=ms/1000,dt=Math.max(0,Math.min(.05,t-last));last=t;if(!dn)rot+=dt*V.spd;
var cx=W*.56,cy=H*.46,Rr=Math.min(W*.34,H*.33)*V.zm,pit=pitB+.1*Math.sin(t*.17),cp=Math.cos(pit),spp=Math.sin(pit);
x.clearRect(0,0,W,H);
var pr=P.map(function(p){var yw=rot*(.8+.4*p.k),q=pj([p.x,p.y,p.z],Math.cos(yw),Math.sin(yw),cp,spp,cx,cy,Rr),u=(q[0]-(cx-Rr))/(2*Rr);q.push(Math.max(0,Math.min(1,(.6-u)/.22)),(q[2]+1)/2);return q});
x.globalCompositeOperation="lighter";x.globalAlpha=1;
var g=x.createRadialGradient(cx,cy,0,cx,cy,Rr*.22);g.addColorStop(0,"rgba(255,225,160,.45)");g.addColorStop(1,"rgba(255,200,100,0)");x.fillStyle=g;x.fillRect(cx-Rr*.22,cy-Rr*.22,Rr*.44,Rr*.44);
x.lineWidth=.6;
pr.forEach(function(q,k){var gw=q[3],tw=Math.pow(Math.sin(t*1.1+k*13.7)*.5+.5,3),a=(.012+.11*tw)*(.35+.65*q[4])*(.45+.55*gw)*V.ln;if(a<.012)return;x.strokeStyle="rgba("+(140+115*gw|0)+","+(185+5*gw|0)+","+(255-185*gw|0)+","+Math.min(a,.5)+")";x.beginPath();x.moveTo(cx+(q[0]-cx)*.1,cy+(q[1]-cy)*.1);x.lineTo(q[0],q[1]);x.stroke()});
/* streams */
x.lineWidth=.8;
F.forEach(function(f){var q=pr[f.t],fa=q[3];if(fa<.05)return;var y0=H*(.12+f.s*.12),col="hsl("+SH[f.s]+",100%,62%)",c1x=cx*.5;x.strokeStyle=col;x.globalAlpha=.26*fa;x.beginPath();x.moveTo(0,y0);x.quadraticCurveTo(c1x,y0,q[0],q[1]);x.stroke();var u=(t*f.v+f.o)%1,v=1-u,px=2*v*u*c1x+u*u*q[0],py=v*v*y0+2*v*u*y0+u*u*q[1];x.globalAlpha=.95*fa;x.fillStyle=col;x.shadowColor=col;x.shadowBlur=8;x.beginPath();x.arc(px,py,1.6,0,PI*2);x.fill();x.shadowBlur=0});x.globalAlpha=1;
/* dots */
x.globalAlpha=1;
pr.forEach(function(q,n){var p=P[n],gw=q[3],k=p.k,a=(.25+.5*gw)*(.5+.5*q[4]),b0=140+115*gw,b1=185+5*gw+k*50*gw,b2=255-185*gw,pc=PR[p.c],m=p.m,hb=Math.max(0,1-(t-HT[n])/.7);
x.globalAlpha=1;x.fillStyle="rgba("+(b0+(pc[0]-b0)*m|0)+","+(b1+(pc[1]-b1)*m|0)+","+(b2+(pc[2]-b2)*m|0)+","+a+")";x.beginPath();x.arc(q[0],q[1],(.8+k*2*gw+.5*q[4])*V.ps,0,PI*2);x.fill();
if(k>.45)blit(m>.3?PAL[p.c]:(gw>.5?40:215),q[0],q[1],(4+k*7)*V.ps,.22*(.5+.5*q[4]));
if(n%11==0&&gw>.4){x.globalAlpha=1;x.strokeStyle="rgba(255,200,80,"+(.6*gw)+")";x.lineWidth=.8;x.beginPath();x.arc(q[0],q[1],(4+k*3)*V.ps,0,PI*2);x.stroke()}
if(hb>0)blit(HH[n],q[0],q[1],(6+10*hb)*V.ps,hb*.9)});
x.globalAlpha=1;x.globalCompositeOperation="source-over";
requestAnimationFrame(frame)}
requestAnimationFrame(frame);
</script>
</body>
</html>
