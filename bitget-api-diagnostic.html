<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Vegas Octopus｜Bitget API 连通性诊断</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;padding:24px;background:#070b14;color:#e8efff;font:15px/1.55 system-ui,-apple-system,sans-serif}main{max-width:900px;margin:auto}h1{font-size:22px}p{color:#a9b7d2}.row{border:1px solid #26344c;border-radius:12px;padding:14px;margin:12px 0;background:#0d1422}.title{font-weight:700}.state{margin:5px 0;color:#f7cf65}.ok{color:#50e3a4}.bad{color:#ff7188}pre{white-space:pre-wrap;word-break:break-word;color:#bac9e6;font-size:12px;margin:8px 0 0}button{background:#192945;color:#e8efff;border:1px solid #405575;border-radius:8px;padding:9px 14px;font-size:14px}small{color:#8190ac}
</style>
</head>
<body><main>
<h1>Bitget 实时行情接口连通性诊断</h1>
<p>此页面仅读取公开行情，不登录、不下单。用于区分网络/CORS、HTTP 状态、Bitget 返回码和 K 线数据问题。</p>
<p id="env"><small>正在读取页面环境…</small></p>
<button id="rerun">重新测试</button>
<div id="results"></div>
<script>
const root=document.getElementById('results');
const env=document.getElementById('env');
env.textContent='页面来源：'+location.origin+' ｜ API：https://api.bitget.com';
function card(title){const d=document.createElement('section');d.className='row';d.innerHTML='<div class="title"></div><div class="state">等待测试</div><pre></pre>';d.querySelector('.title').textContent=title;root.appendChild(d);return{state:d.querySelector('.state'),pre:d.querySelector('pre')};}
async function request(path){
 const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),12000);
 try{
  const response=await fetch('https://api.bitget.com'+path,{cache:'no-store',signal:controller.signal});
  const text=await response.text();let payload;
  try{payload=JSON.parse(text)}catch{throw new Error('HTTP '+response.status+'，响应不是 JSON：'+text.slice(0,180))}
  if(!response.ok)throw new Error('HTTP '+response.status+'：'+JSON.stringify(payload).slice(0,240));
  if(payload.code!=='00000')throw new Error('Bitget code='+payload.code+' msg='+payload.msg);
  if(!Array.isArray(payload.data))throw new Error('返回码成功，但 data 不是数组');
  return {payload,data:payload.data};
 }catch(e){
  if(e.name==='AbortError')throw new Error('请求超时（12 秒）；可能是网络、跨域或 API 响应问题');
  if(e instanceof TypeError)throw new Error('fetch 失败：浏览器网络错误或 CORS 拦截。原始信息：'+e.message);
  throw e;
 }finally{clearTimeout(timer)}
}
async function testOne(title,path,check){
 const c=card(title);c.state.textContent='请求中…';
 const start=performance.now();
 try{
  const r=await request(path);const extra=check?check(r.data,r.payload):'';
  c.state.className='state ok';c.state.textContent='通过 ｜ '+r.data.length+' 条数据 ｜ '+Math.round(performance.now()-start)+' ms';
  c.pre.textContent='请求：'+path+'\nBitget code：'+r.payload.code+' ｜ msg：'+r.payload.msg+'\n'+extra+'\n数据样例：'+JSON.stringify(r.data.slice(0,2),null,2);
  return r;
 }catch(e){c.state.className='state bad';c.state.textContent='失败 ｜ '+e.message;c.pre.textContent='请求：'+path+'\n错误类型：'+e.name+'\n说明：'+String(e);return null}
}
function candleCheck(data){
 if(!data.length)return '警告：接口成功但 K 线数组为空';
 const rows=data.map(r=>({t:Number(r[0]),o:Number(r[1]),h:Number(r[2]),l:Number(r[3]),c:Number(r[4])})).filter(r=>Number.isFinite(r.t)&&[r.o,r.h,r.l,r.c].every(Number.isFinite)).sort((a,b)=>a.t-b.t);
 return '有效 OHLC 行：'+rows.length+'\n最早时间：'+(rows.length?new Date(rows[0].t).toISOString():'无')+'\n最新时间：'+(rows.length?new Date(rows[rows.length-1].t).toISOString():'无')+'\n注意：Bitget K 线时间戳应为毫秒。';
}
async function run(){
 document.getElementById('rerun').disabled=true;root.replaceChildren();
 const stock=await testOne('1. Reality 股票交易对列表','/api/v3/reality/market/stock-info',data=>'股票交易对数量：'+data.length+'\nAAPL 样例：'+JSON.stringify(data.find(x=>String(x.code).toUpperCase()==='AAPL')||data[0]||null));
 await testOne('2. 正式页面使用的 USDT-FUTURES 全市场行情','/api/v2/mix/market/tickers?productType=USDT-FUTURES',data=>'行情品种数量：'+data.length+'\nBTCUSDT 样例：'+JSON.stringify(data.find(x=>String(x.symbol).toUpperCase()==='BTCUSDT')||null));
 await testOne('3. 正式页面使用的 SPOT 全市场行情','/api/v3/market/tickers?category=SPOT',data=>'现货品种数量：'+data.length+'\n首个交易对：'+JSON.stringify(data[0]||null));
 const futures=await testOne('4. BTCUSDT 合约 4H 最新 K 线','/api/v2/mix/market/candles?symbol=BTCUSDT&productType=USDT-FUTURES&granularity=4H&limit=1000',candleCheck);
 let sym=null;
 if(stock){const row=stock.data.find(x=>String(x.code).toUpperCase()==='AAPL')||stock.data[0];sym=row&&row.symbol;}
 if(sym){
  const p=new URLSearchParams({category:'SPOT',symbol:sym,interval:'4H',limit:'1000'});
  const reality=await testOne('5. Reality 股票 '+sym+' 的 4H 最新 K 线','/api/v3/market/candles?'+p,candleCheck);
  if(reality&&reality.data.length){
   const endTime=Number(reality.data.map(r=>Number(r[0])).filter(Number.isFinite).sort((a,b)=>a-b)[0])-1;
   const hp=new URLSearchParams({category:'SPOT',symbol:sym,interval:'4H',endTime:String(endTime),limit:'100'});
   await testOne('6. Reality 股票历史 K 线分页','/api/v3/market/history-candles?'+hp,candleCheck);
  }
 }else{
  const c=card('5. Reality 股票 4H K 线');c.state.className='state bad';c.state.textContent='跳过：股票交易对列表接口未返回可用数据';c.pre.textContent='先检查第 1 项失败原因。';
 }
 if(futures&&futures.data.length){
  const endTime=Number(futures.data.map(r=>Number(r[0])).filter(Number.isFinite).sort((a,b)=>a-b)[0])-1;
  const hp=new URLSearchParams({symbol:'BTCUSDT',productType:'USDT-FUTURES',granularity:'4H',endTime:String(endTime),limit:'200'});
  await testOne('7. BTCUSDT 合约历史 K 线分页','/api/v2/mix/market/history-candles?'+hp,candleCheck);
 }
 document.getElementById('rerun').disabled=false;
}
document.getElementById('rerun').addEventListener('click',run);run();
</script></main></body></html>
