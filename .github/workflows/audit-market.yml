name: Temporary Bitget Market Integration Audit
on:
  push:
    paths:
      - '.github/workflows/audit-market.yml'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Audit all 27 official pool symbols against Bitget public APIs
        env:
          STOCKS: AAPL,MSFT,GOOGL,AMZN,NVDA,TSLA,META,INTC,QCOM,AMD,TSM,AVGO,ORCL,ARM,MU,ASML,SNDK,SKHYNIX,MRVL,GLW,HOOD,CBRS,SPCX
          CORES: BTC,HYPE,XAU,CL
        run: |
          node <<'NODE'
          const delay = ms => new Promise(r => setTimeout(r, ms));
          async function api(path) {
            const res = await fetch('https://api.bitget.com' + path, { signal: AbortSignal.timeout(15000) });
            if (!res.ok) throw new Error(path + ' HTTP ' + res.status);
            const json = await res.json();
            if (json.code !== '00000' || !Array.isArray(json.data)) throw new Error(path + ' API error: ' + json.code + ' ' + json.msg);
            return json.data;
          }
          (async () => {
            const stocks = process.env.STOCKS.split(',');
            const cores = process.env.CORES.split(',');
            const [info, spot, futures] = await Promise.all([
              api('/api/v3/reality/market/stock-info'),
              api('/api/v3/market/tickers?category=SPOT'),
              api('/api/v2/mix/market/tickers?productType=USDT-FUTURES')
            ]);
            const spotMap = new Map(spot.map(x => [String(x.symbol || '').toUpperCase(), x]));
            const futureMap = new Map(futures.map(x => [String(x.symbol || '').toUpperCase(), x]));
            const results = [];
            for (const code of stocks) {
              let row = info.find(x => String(x.code || '').trim().toUpperCase() === code);
              if (code === 'SKHYNIX' && !row) row = info.find(x =>
                String(x.code || '').toUpperCase().replace(/[^A-Z0-9]/g, '') === 'SKHY' ||
                /SK\s*HYNIX/i.test(String(x.name || '')) ||
                /RSKHYUSDT/i.test(String(x.symbol || '')));
              const symbol = row && String(row.symbol || '').trim();
              const ticker = symbol && spotMap.get(symbol.toUpperCase());
              let candles = false, candleError = '';
              if (symbol) {
                try {
                  const rows = await api('/api/v3/market/candles?' + new URLSearchParams({category:'SPOT',symbol,interval:'4H',limit:'5'}));
                  candles = rows.some(r => Array.isArray(r) && Number(r[1]) > 0 && Number(r[2]) > 0 && Number(r[3]) > 0 && Number(r[4]) > 0);
                  if (!candles) candleError = 'no valid 4H candles';
                } catch (e) { candleError = String(e.message || e); }
              }
              const price = !!(ticker && Number(ticker.lastPrice) > 0 && Number(ticker.openPrice24h) > 0);
              results.push({pool:code, apiSymbol:symbol || 'NOT_FOUND', stockInfo:!!row, spotTicker:!!ticker, validPrice:price, fourHourCandles:candles, status:row&&ticker&&price&&candles?'PASS':'FAIL', detail:candleError});
              await delay(120);
            }
            for (const code of cores) {
              const symbol = code + 'USDT';
              const ticker = futureMap.get(symbol);
              let candles = false, candleError = '';
              try {
                const rows = await api('/api/v2/mix/market/candles?' + new URLSearchParams({productType:'USDT-FUTURES',symbol,granularity:'4H',limit:'5'}));
                candles = rows.some(r => Array.isArray(r) && Number(r[1]) > 0 && Number(r[2]) > 0 && Number(r[3]) > 0 && Number(r[4]) > 0);
                if (!candles) candleError = 'no valid 4H candles';
              } catch (e) { candleError = String(e.message || e); }
              const price = !!(ticker && Number(ticker.lastPr) > 0 && Number(ticker.open24h) > 0);
              results.push({pool:code, apiSymbol:symbol, futuresTicker:!!ticker, validPrice:price, fourHourCandles:candles, status:ticker&&price&&candles?'PASS':'FAIL', detail:candleError});
              await delay(120);
            }
            console.log('POOL_SYMBOLS=' + results.length);
            console.log(JSON.stringify(results, null, 2));
            const failed = results.filter(x => x.status !== 'PASS');
            console.log('AUDIT_SUMMARY=' + (results.length-failed.length) + '/' + results.length + ' PASS; ' + failed.length + ' FAIL');
            if (failed.length) process.exitCode = 1;
          })().catch(e => { console.error('AUDIT_ABORTED:', e); process.exit(2); });
          NODE
